<script>
/* ============================================================================
   VISITOR COUNTER  (localStorage-gated — runs BEFORE the module so it's fast)
   ----------------------------------------------------------------------------
   • First visit from this device  → load the badge image (increments the counter)
   • Every later visit             → show cached badge, no API hit
   • Clearing site data / incognito → fresh localStorage, may count again
   ========================================================================== */
(function () {
  const KEY         = 'eph_port_counted_v1';
  const SLUG        = 'Eph-ring-road-playground';   // change to your unique path
  const BADGE_URL   = 'https://api.visitorbadge.io/api/visitors' +
                      '?path=' + encodeURIComponent(SLUG) +
                      '&label=&countColor=%23ffd23f&labelColor=%23ffd23f&style=flat';
  const slot        = document.getElementById('visitorSlot');
  const label       = document.getElementById('visitorLabel');
  const dot         = document.getElementById('visitorDot');

  let alreadyCounted = false;
  try { alreadyCounted = !!localStorage.getItem(KEY); } catch (e) {}

  if (!alreadyCounted) {
    /* First visit on this device → request the badge once */
    const img = document.createElement('img');
    img.id  = 'visitorImg';
    img.src = BADGE_URL;
    img.alt = 'visitor count';
    img.addEventListener('error', () => { img.style.display = 'none'; });
    slot.appendChild(img);

    try { localStorage.setItem(KEY, String(Date.now())); } catch (e) {}
    label.textContent = 'VISITORS';
  } else {
    /* Returning device → show a cached-friendly note, no API request */
    dot.classList.add('cached');
    label.textContent = 'VISITED';

    /* Try to show the same badge visually without a new network request.
       If the browser has it cached it will render instantly; otherwise
       the image fails silently and we fall back to a tick mark. */
    const img = document.createElement('img');
    img.id  = 'visitorImg';
    img.src = BADGE_URL;
    img.alt = '';
    img.addEventListener('error', () => {
      img.remove();
      const tick = document.createElement('span');
      tick.textContent = '✓';
      tick.style.color = '#ffd23f';
      tick.style.font = '900 14px ui-monospace,monospace';
      slot.appendChild(tick);
    });
    slot.appendChild(img);
  }
})();
</script>

/* ============================================================================

class RingPath {
  constructor(A, B, R) {
    const a = A - R, b = B - R, hl = Math.PI * R * 0.5;
    this.segs = [
      { t:0, x0:-a, z0: B, dx: 1, dz: 0, len: 2*a },
      { t:1, cx: a, cz: b, R, a0: Math.PI/2, dir:-1, len: hl },
      { t:0, x0: A, z0: b, dx: 0, dz:-1, len: 2*b },
      { t:1, cx: a, cz:-b, R, a0: 0,         dir:-1, len: hl },
      { t:0, x0: a, z0:-B, dx:-1, dz: 0, len: 2*a },
      { t:1, cx:-a, cz:-b, R, a0:-Math.PI/2, dir:-1, len: hl },
      { t:0, x0:-A, z0:-b, dx: 0, dz: 1, len: 2*b },
      { t:1, cx:-a, cz: b, R, a0: Math.PI,   dir:-1, len: hl }
    ];
    this.cum = [0]; let L = 0;
    for (const s of this.segs) { L += s.len; this.cum.push(L); }
    this.length = L;
  }
  at(s, out) {
    out = out || {};
    const L = this.length; s = s - Math.floor(s/L) * L;
    const segs = this.segs, cum = this.cum;
    let i = 0; while (i < segs.length - 1 && s >= cum[i+1]) i++;
    const g = segs[i], u = s - cum[i];
    if (g.t === 0) {
      out.x = g.x0 + g.dx*u; out.z = g.z0 + g.dz*u;
      out.tx = g.dx; out.tz = g.dz; out.k = 0;
    } else {
      const th = g.a0 + g.dir*(u/g.R), c = Math.cos(th), sn = Math.sin(th);
      out.x = g.cx + g.R*c; out.z = g.cz + g.R*sn;
      out.tx = -sn*g.dir; out.tz = c*g.dir; out.k = 1/g.R;
    }
    return out;
  }
}

const RING = new RingPath(60, 42, 16);
const L = RING.length;

function stripGeo(path, offA, yA, offB, yB, N) {
  const pos=[], nor=[], uv=[], idx=[], p={};
  for (let i=0; i<=N; i++) {
    const s = (i/N)*path.length; path.at(s, p);
    const rx=-p.tz, rz=p.tx;
    const ax=p.x+rx*offA, az=p.z+rz*offA;
    const bx=p.x+rx*offB, bz=p.z+rz*offB;
    pos.push(ax,yA,az, bx,yB,bz);
    const dxv=bx-ax, dyv=yB-yA, dzv=bz-az;
    let nx=dyv*p.tz, ny=dzv*p.tx-dxv*p.tz, nz=-dyv*p.tx;
    const nl=Math.hypot(nx,ny,nz)||1;
    nor.push(nx/nl,ny/nl,nz/nl, nx/nl,ny/nl,nz/nl);
    uv.push(0,i/N, 1,i/N);
  }
  for (let i=0;i<N;i++){const a=i*2; idx.push(a,a+1,a+2, a+1,a+3,a+2);}
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',   new THREE.Float32BufferAttribute(nor,3));
  g.setAttribute('uv',       new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx); return g;
}

function wheelGeo(r, w) {

  const list = [
    [CY(r,r,w,12,0,0,0,0,0,Math.PI/2), 0x1b1b1b],
    [CY(r*0.46,r*0.46,w*1.02,10,0,0,0,0,0,Math.PI/2), 0xb9b9b9]

  for (let i=0;i<3;i++) list.push([BX(w*1.30, r*1.55, 0.07, 0,0,0, i*Math.PI/3,0,0), 0xdcdcdc]);
  g = P(list); wheelCache.set(key, g); return g;
}
function buildGroup(spec) {
  const g = new THREE.Group();
  for (const key in spec) {
    if (!spec[key].length) continue;
    g.add(new THREE.Mesh(P(spec[key]), MAT[key==='glass'?'glass':'vehicle']));
  }
  return g;
}

class RingVehicle {
  constructor(type, lane, p) {
    const T = TYPES[type];
    this.type=type; this.lane=lane; this.dir=lane.dir; this.off=lane.off;
    this.p=p; this.spd=T.v0*0.55; this.v0=T.v0; this.aMax=T.aMax;
    this.len=T.len; this.acc=0; this.wheelR=T.wheelR;
    this.weavePhase=rnd()*TAU; this.lean=0;
    this.obj = TEMPLATES[type].clone(true);
    this.wheels = [];
    const wg = wheelGeo(T.wheelR, T.wheelW);
    for (const [wx,wy,wz] of T.wheels) {
      const w = new THREE.Mesh(wg, MAT.tire);
      w.position.set(wx,wy,wz); this.obj.add(w); this.wheels.push(w);
    }
    const sh = new THREE.Mesh(SHADOW_GEO, MAT.shadow);
    sh.scale.set(T.shadow[0],1,T.shadow[1]); sh.position.y=0.045;
    this.obj.add(sh);
    scene.add(this.obj);
  }
  get s() { return this.dir>0 ? mod(this.p,L) : mod(-this.p,L); }
}
class CrossVehicle {
  constructor(type, lane, p) {
    const T = TYPES[type];
    this.type=type; this.lane=lane; this.dir=lane.dir; this.p=p;

   ========================================================================== */
function idm(v, gap, dv) {
  const s0=2.0, T=1.15, b=2.4, a=v.aMax;
  if (gap < 0.10) gap = 0.10;
  const sStar = s0 + Math.max(0, v.spd*T + (v.spd*dv)/(2*Math.sqrt(a*b)));
  const free  = 1 - Math.pow(Math.min(v.spd/v.v0, 2.5), 4);
  return a * (free - (sStar*sStar)/(gap*gap));
}
const _p = {};
function updateRingTraffic(dt, t, st) {
  const stop = ringStopOf(st);
  for (const lane of LANES) {
    const vs = lane.veh, n = vs.length; if (!n) continue;
    vs.sort((a,b)=>a.p-b.p);
    const stopP = lane.dir>0 ? [mod(STOP_RING[0],L), mod(STOP_RING[1],L)]
                             : [mod(-STOP_RING[0],L), mod(-STOP_RING[1],L)];
    for (let i=0;i<n;i++) {
      const v = vs[i];
      let a = v.aMax*(1 - Math.pow(Math.min(v.spd/v.v0,2.5),4));
      const lead = vs[(i+1)%n];
      const leadP = (i+1<n) ? lead.p : lead.p+L;
      const gap = leadP - v.p - (v.len+lead.len)*0.5;
      a = Math.min(a, idm(v, gap, v.spd-lead.spd));
      if (stop) for (let k=0;k<2;k++) {
        const d = mod(stopP[k]-v.p, L);
        if (d < 65) a = Math.min(a, idm(v, d - v.len*0.5, v.spd));
      }
      v.acc = clamp(a, -7.5, v.aMax);
    }
    for (const v of vs) {
      v.spd = Math.max(0, v.spd + v.acc*dt);
      if (v.spd > v.v0*1.30) v.spd = v.v0*1.30;
      v.p += v.spd*dt;
    }
  }
}
function updateCrossTraffic(dt, t, st) {
  const stop = crossStopOf(st);
  for (const lane of CROSS_LANES) {
    const vs = lane.veh, n = vs.length; if (!n) continue;
    vs.sort((a,b)=>a.p-b.p);
    for (let i=0;i<n;i++) {
      const v = vs[i];
      let a = v.aMax*(1 - Math.pow(Math.min(v.spd/v.v0,2.5),4));
      const lead = vs[(i+1)%n];
      const leadP = (i+1<n) ? lead.p : lead.p+CROSS_LEN;
      const gap = leadP - v.p - (v.len+lead.len)*0.5;
      a = Math.min(a, idm(v, gap, v.spd-lead.spd));
      if (stop) for (let k=0;k<2;k++) {
        const d = mod(CROSS_STOP[k]-v.p, CROSS_LEN);
        if (d < 70) a = Math.min(a, idm(v, d - v.len*0.5, v.spd));
      }
      v.acc = clamp(a, -7.5, v.aMax);
    }
    for (const v of vs) {
      v.spd = Math.max(0, v.spd + v.acc*dt);
      if (v.spd > v.v0*1.30) v.spd = v.v0*1.30;
      v.p += v.spd*dt;
    }
  }
}
function placeRingVehicle(v, dt, t) {
  const s = v.s; RING.at(s, _p);
  const rx = -_p.tz, rz = _p.tx;
  let off = v.off;
  if (v.type === 'okada') off += Math.sin(t*1.9 + v.weavePhase)*0.75;
  v.obj.position.set(_p.x + rx*off, 0, _p.z + rz*off);
  const fx = _p.tx*v.dir, fz = _p.tz*v.dir;
  const yaw = Math.atan2(fx, fz);
  let lean = 0;
  if (v.type === 'okada') {
    const tg = Math.atan((v.spd*v.spd*_p.k)/(9.81*1.55));
    lean = lerp(v.lean, tg, 1 - Math.exp(-dt*4)); v.lean = lean;
  } else if (v.type === 'keke') {
    const tg = Math.atan((v.spd*v.spd*_p.k)/(9.81*4.5));
    lean = lerp(v.lean, tg, 1 - Math.exp(-dt*3)); v.lean = lean;
  }
  v.obj.rotation.set(0, yaw, lean);
  const spin = (v.spd*dt)/v.wheelR;
  for (const w of v.wheels) w.rotation.x -= spin;
}
function placeCrossVehicle(v, dt) {
  const u = mod(v.p, CROSS_LEN);
  const z = v.dir>0 ? (-CROSS_HALF+u) : (CROSS_HALF-u);
  v.obj.position.set(v.lane.x, 0, z);
  v.obj.rotation.set(0, v.dir>0 ? 0 : Math.PI, 0);
  const spin = (v.spd*dt)/v.wheelR;
  for (const w of v.wheels) w.rotation.x -= spin;
}

let audioCtx = null, noiseBuf = null;
function ensureAudio() {
  if (audioCtx) { if (audioCtx.state === 'suspended') audioCtx.resume(); return; }
  try {
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const len = Math.floor(audioCtx.sampleRate * 1.6);
    noiseBuf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i=0; i<len; i++) d[i] = Math.random()*2-1;
  } catch(e){ audioCtx = null; }
}
function playKick(power) {
  if (!audioCtx || !noiseBuf) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  osc.type='sine';
  osc.frequency.setValueAtTime(190, t);
  osc.frequency.exponentialRampToValueAtTime(52, t+0.10);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.42*power, t+0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t+0.16);
  osc.connect(g).connect(audioCtx.destination);
  osc.start(t); osc.stop(t+0.18);
  const src = audioCtx.createBufferSource();
  src.buffer = noiseBuf;
  const bp = audioCtx.createBiquadFilter();
  bp.type='bandpass'; bp.frequency.value=1900; bp.Q.value=0.9;
  const ng = audioCtx.createGain();
  ng.gain.setValueAtTime(0.28*power, t);
  ng.gain.exponentialRampToValueAtTime(0.0001, t+0.07);
  src.connect(bp).connect(ng).connect(audioCtx.destination);
  src.start(t, 0, 0.09);
}
function playBounce(vol) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  osc.type='sine';
  osc.frequency.setValueAtTime(130, t);
  osc.frequency.exponentialRampToValueAtTime(58, t+0.07);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.20*vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+0.10);
  osc.connect(g).connect(audioCtx.destination);
  osc.start(t); osc.stop(t+0.12);
}
function playPost() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  osc.type='triangle';
  osc.frequency.setValueAtTime(920, t);
  osc.frequency.exponentialRampToValueAtTime(430, t+0.32);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.24, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+0.42);
  osc.connect(g).connect(audioCtx.destination);
  osc.start(t); osc.stop(t+0.45);
}
function playCheer() {
  if (!audioCtx || !noiseBuf) return;
  const t = audioCtx.currentTime, dur = 2.1;
  const src = audioCtx.createBufferSource();
  src.buffer = noiseBuf; src.loop = true;
  const bp = audioCtx.createBiquadFilter();
  bp.type='bandpass';
  bp.frequency.setValueAtTime(620, t);
  bp.frequency.linearRampToValueAtTime(1900, t+0.34);
  bp.frequency.linearRampToValueAtTime(880, t+dur);
  bp.Q.value = 1.1;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.60, t+0.10);
  g.gain.linearRampToValueAtTime(0.42, t+0.55);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  src.connect(bp).connect(g).connect(audioCtx.destination);
  src.start(t); src.stop(t+dur+0.05);
  for (let i=0; i<4; i++) {
    const o = audioCtx.createOscillator();
    o.type='sawtooth';
    const bf = 290 + i*95;
    const tt = t + i*0.055;
    o.frequency.setValueAtTime(bf, tt);
    o.frequency.linearRampToValueAtTime(bf*1.42, tt+0.30);
    o.frequency.linearRampToValueAtTime(bf*0.88, tt+1.05);
    const og = audioCtx.createGain();
    og.gain.setValueAtTime(0.0001, t);
    og.gain.linearRampToValueAtTime(0.045, tt+0.16);
    og.gain.exponentialRampToValueAtTime(0.0001, t+1.35);
    const lp = audioCtx.createBiquadFilter();
    lp.type='lowpass'; lp.frequency.value = 1650;
    o.connect(lp).connect(og).connect(audioCtx.destination);
    o.start(t); o.stop(t+1.45);
  }
}

function roundRectPath(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.lineTo(x + w - r, y);
  g.quadraticCurveTo(x + w, y, x + w, y + r);
  g.lineTo(x + w, y + h - r);
  g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  g.lineTo(x + r, y + h);
  g.quadraticCurveTo(x, y + h, x, y + h - r);
  g.lineTo(x, y + r);
  g.quadraticCurveTo(x, y, x + r, y);
  g.closePath();
}

function makeStripeTexture(c1, c2, bands) {
  const c = document.createElement('canvas');
  c.width = 128; c.height = 128;
  const g = c.getContext('2d');
  const w = c.width / bands;
  for (let i = 0; i < bands; i++) {
    g.fillStyle = (i % 2 === 0) ? c1 : c2;
    g.fillRect(Math.floor(i * w), 0, Math.ceil(w) + 1, c.height);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 2;
  return tex;
}

    addPart(GEO.uarm, shirtC, sh);
    const el = new THREE.Group();
    el.position.y = -UPPER_ARM;
    sh.add(el);
    addPart(GEO.farm, skinC, el);
    addPart(GEO.hand, skinC, el);
    return { shoulder: sh, elbow: el };
  };
  const armL = buildArm( 1);
  const armR = buildArm(-1);

  const buildLeg = (side) => {
    const hp = new THREE.Group();
    hp.position.set(side * HIP_X, 0, 0);
    hip.add(hp);
    addPart(GEO.thigh, pantsC, hp);
    const kn = new THREE.Group();
    kn.position.y = -THIGH_LEN;
    hp.add(kn);
    addPart(GEO.shin, pantsC, kn);
    const an = new THREE.Group();
    an.position.y = -SHIN_LEN;
    kn.add(an);
    addPart(GEO.foot, 0x2a2a2a, an);
    return { hip: hp, knee: kn, ankle: an };
  };
  const legL = buildLeg( 1);
  const legR = buildLeg(-1);

  const shadow = new THREE.Mesh(SHADOW_GEO, MAT.shadow);
  shadow.scale.set(0.42, 1, 0.42);
  shadow.position.y = 0.02;
  root.add(shadow);

  return {
    root, hip, armL, armR, legL, legR, shadow, head,
    face: { eyeL, eyeR, mouthNeutral, mouthSmile, emote }
  };
}

function setExpression(rig, mode) {
  const f = rig.face;
  if (!f) return;
  if (mode === 'suu') {
    f.mouthNeutral.visible = false;
    f.mouthSmile.visible   = true;
    f.eyeL.scale.set(1.15, 0.42, 1);
    f.eyeR.scale.set(1.15, 0.42, 1);
    f.emote.visible = true;
    rig._expr = 'suu';
  } else {
    f.mouthNeutral.visible = true;
    f.mouthSmile.visible   = false;
    f.eyeL.scale.set(1, 1, 1);
    f.eyeR.scale.set(1, 1, 1);
    f.emote.visible = false;
    rig._expr = 'neutral';
  }
}

/* ============================================================================
   13.  POSE
   ========================================================================== */
function legCycle(p, s01, strideAmp = 0.65, kneeAmp = 1.30, footAmp = 0.35) {
  const swing = Math.sin(p);
  const lift  = Math.max(0, Math.sin(p + Math.PI * 0.72));
  const hipA  = swing * strideAmp * s01;
  const kneeA = lift * kneeAmp * s01 + 0.06;
  const footA = -(hipA + kneeA) * 0.88 + Math.sin(p * 2) * footAmp * s01;
  return { hip: hipA, knee: kneeA, foot: footA };
}
function armCycle(p, s01) {
  const swing = Math.sin(p);
  return {
    shoulder: swing * 0.52 * s01,
    elbow: 0.18 + Math.max(0, swing) * 0.62 * s01 + 0.10 * s01
  };
}

function computePose(c, dt) {
  const s01   = clamp(c.speed / c.runSpeed, 0, 1);
  const phase = c.cyclePhase;

  const P = {
    hipY: HIP_Y, lean: 0,
    legL: { hip: 0, knee: 0.05, foot: 0 },
    legR: { hip: 0, knee: 0.05, foot: 0 },
    armL: { shoulder: 0, elbow: 0.20 },
    armR: { shoulder: 0, elbow: 0.20 }
  };

  if (c.celebrateTimer > 0) {
    const k = clamp(c.celebrateTimer / c.celebrateDuration, 0, 1);
    const t = c.t;
    const env = Math.min(1, k * 2.4);
    const bounce = Math.abs(Math.sin(t * 9.5)) * 0.17 * env;
    const wave   = Math.sin(t * 11.0) * 0.30 * env;
    P.hipY = HIP_Y + bounce;
    P.lean = -0.13 * env;
    P.armL.shoulder = (2.62 + wave) * env;
    P.armR.shoulder = (2.62 - wave) * env;
    P.armL.elbow = 0.55 * env;
    P.armR.elbow = 0.55 * env;
    P.legL.hip  = -0.10 * env;
    P.legR.hip  = -0.10 * env;
    P.legL.knee = (0.22 + bounce * 2.2) * env;
    P.legR.knee = (0.22 + bounce * 2.2) * env;
    P.legL.foot = -0.12 * env;
    P.legR.foot = -0.12 * env;
    return P;
  }

  if (c.onGround) {
    if (s01 < 0.02) {
      const b = Math.sin(c.t * 1.6) * 0.012;
      P.hipY = HIP_Y + b;
      P.legL.knee = 0.06 + b * 0.4;
      P.legR.knee = 0.06 + b * 0.4;
      P.armL.elbow = 0.22 + b * 0.8;
      P.armR.elbow = 0.22 + b * 0.8;
      P.armL.shoulder = Math.sin(c.t * 1.6) * 0.05;
      P.armR.shoulder = -Math.sin(c.t * 1.6) * 0.05;
    } else {
      const pL = phase, pR = phase + Math.PI;
      P.lean = 0.06 + s01 * 0.30;
      P.hipY = HIP_Y + Math.cos(phase * 2) * (0.025 + s01 * 0.045);
      P.legL = legCycle(pL, s01, 0.55 + s01*0.30, 1.05 + s01*0.55, 0.20 + s01*0.35);
      P.legR = legCycle(pR, s01, 0.55 + s01*0.30, 1.05 + s01*0.55, 0.20 + s01*0.35);
      P.armL = armCycle(pR, s01);
      P.armR = armCycle(pL, s01);
      const sway = Math.sin(phase) * 0.035 * s01;
      P.armL.shoulder -= sway;
      P.armR.shoulder -= sway;
    }
  } else {
    const upT = clamp(c.vel.y / 5.0, -1, 1);
    if (upT > 0) {
      const k = smoothstep(upT);
      P.legL.hip = -lerp(0.10, 0.55, k);
      P.legR.hip = -lerp(0.00, 0.30, k);
      P.legL.knee =  lerp(0.30, 1.30, k);
      P.legR.knee =  lerp(0.20, 0.90, k);
      P.legL.foot = -0.25;
      P.legR.foot = -0.15;
      P.armL.shoulder = -lerp(0.30, 1.35, k);
      P.armR.shoulder = -lerp(0.30, 1.35, k);
      P.armL.elbow = 0.35; P.armR.elbow = 0.35;
      P.hipY = HIP_Y + 0.02 * k;
      P.lean = 0.12 * k;
    } else {
      const k = smoothstep(-upT);
      P.legL.hip = -lerp(0.15, 0.35, k);
      P.legR.hip = -lerp(0.05, 0.15, k);
      P.legL.knee =  lerp(0.30, 0.70, k);
      P.legR.knee =  lerp(0.30, 0.55, k);
      P.legL.foot = -0.10; P.legR.foot = -0.10;
      P.armL.shoulder = lerp(-0.30, 0.20, k);
      P.armR.shoulder = lerp(-0.30, 0.20, k);
      P.armL.elbow = 0.30; P.armR.elbow = 0.30;
      P.lean = 0.05;
    }
  }

  if (c.landTimer > 0) {
    const k = c.landTimer / c.landDuration;
    const e = k * k;
    P.hipY   -= 0.16 * e;
    P.legL.knee += 0.85 * e;  P.legR.knee += 0.85 * e;
    P.legL.hip  -= 0.30 * e;  P.legR.hip  -= 0.30 * e;
    P.legL.foot += 0.35 * e;  P.legR.foot += 0.35 * e;
    P.armL.shoulder -= 0.35 * e; P.armR.shoulder -= 0.35 * e;
    P.lean += 0.18 * e;
  }

  if (c.kickTimer > 0) {
    const k = c.kickTimer / c.kickDuration;
    const t = 1 - k;
    let swing;
    if (t < 0.32)      swing = -smoothstep(t / 0.32) * 0.55;
    else if (t < 0.55) swing = lerp(-0.55, 1.35, smoothstep((t - 0.32) / 0.23));
    else               swing = lerp(1.35, 0.25, smoothstep((t - 0.55) / 0.45));
    P.legR.hip  = swing;
    P.legR.knee = Math.max(0.05, 0.55 - swing * 0.35);
    P.legR.foot = -(P.legR.hip + P.legR.knee) * 0.7 - 0.15;
    P.armL.shoulder = -swing * 0.55;
    P.armR.shoulder =  swing * 0.40;
    P.lean += swing * 0.10;
  }

  return P;
}

function applyPose(rig, pose) {
  rig.hip.position.y = pose.hipY;
  rig.hip.rotation.x = -pose.lean;

  rig.legL.hip.rotation.x   = -pose.legL.hip;
  rig.legL.knee.rotation.x  =  pose.legL.knee;
  rig.legL.ankle.rotation.x =  pose.legL.foot;
  rig.legR.hip.rotation.x   = -pose.legR.hip;
  rig.legR.knee.rotation.x  =  pose.legR.knee;
  rig.legR.ankle.rotation.x =  pose.legR.foot;

  rig.armL.shoulder.rotation.x = -pose.armL.shoulder;
  rig.armL.elbow.rotation.x    =  pose.armL.elbow;
  rig.armR.shoulder.rotation.x = -pose.armR.shoulder;
  rig.armR.elbow.rotation.x    =  pose.armR.elbow;
}

/* ============================================================================
   14.  CHARACTER CONTROLLER
   ========================================================================== */
const GRAVITY     = 22.0;
const JUMP_VEL    = 7.2;
const WALK_SPEED  = 2.6;
const RUN_SPEED   = 5.8;
const ACCEL       = 16.0;
const DECEL       = 22.0;
const AIR_ACCEL   = 4.5;
const COYOTE      = 0.11;
const JUMP_BUFFER = 0.14;
const JUMP_CUT    = 0.42;

class Character {
  constructor(rig, x, z, yaw, team = 0) {
    this.rig = rig;
    this.team = team;
    this.pos = new THREE.Vector3(x, 0, z);
    this.vel = new THREE.Vector3();
    this.yaw = yaw;
    this.targetYaw = yaw;
    this.onGround = true;
    this.speed = 0;
    this.runSpeed = RUN_SPEED;
    this.cyclePhase = 0;
    this.t = 0;
    this.kickTimer = 0;
    this.kickDuration = 0.42;
    this.landTimer = 0;
    this.landDuration = 0.24;
    this.celebrateTimer = 0;
    this.celebrateDuration = 2.4;
    this.coyote = 0;
    this.jumpBuffer = 0;
    this.jumpHeld = false;
  }

  kick() { this.kickTimer = this.kickDuration; }
  jump() { this.jumpBuffer = JUMP_BUFFER; }
  releaseJump() { this.jumpHeld = false; }

  celebrate() {
    this.celebrateTimer = this.celebrateDuration;
    this.kickTimer = 0;
    this.landTimer = 0;
    this.vel.set(0, 0, 0);
    setExpression(this.rig, 'suu');
  }

  update(dt, wishX, wishZ, wantJump, jumpHeld) {
    this.t += dt;
    if (this.kickTimer > 0) this.kickTimer -= dt;
    if (this.landTimer > 0) this.landTimer -= dt;

    if (this.celebrateTimer > 0) {
      this.celebrateTimer -= dt;
      wishX = 0; wishZ = 0; wantJump = false;
      this.vel.x = damp(this.vel.x, 0, 12, dt);
      this.vel.z = damp(this.vel.z, 0, 12, dt);
      if (this.celebrateTimer <= 0) setExpression(this.rig, 'neutral');
    }

    if (wantJump) this.jumpBuffer = JUMP_BUFFER;
    if (this.jumpBuffer > 0) this.jumpBuffer -= dt;
    this.jumpHeld = jumpHeld;

    if (this.onGround) this.coyote = COYOTE;
    else if (this.coyote > 0) this.coyote -= dt;

    if (this.jumpBuffer > 0 && (this.onGround || this.coyote > 0) && this.celebrateTimer <= 0) {
      this.vel.y = JUMP_VEL;
      this.onGround = false;
      this.coyote = 0;
      this.jumpBuffer = 0;
      this.landTimer = 0;
    }

    const inputMag = Math.hypot(wishX, wishZ);
    const hasInput = inputMag > 0.02;
    let dx = 0, dz = 0;
    if (hasInput) { dx = wishX / inputMag; dz = wishZ / inputMag; }

    const targetSpeed = hasInput ? (WALK_SPEED + (RUN_SPEED - WALK_SPEED) * clamp(inputMag, 0, 1)) : 0;
    const accelRate = this.onGround ? (hasInput ? ACCEL : DECEL) : AIR_ACCEL;

    this.vel.x = damp(this.vel.x, dx * targetSpeed, accelRate, dt);
    this.vel.z = damp(this.vel.z, dz * targetSpeed, accelRate, dt);

    if (!this.onGround) {
      this.vel.y -= GRAVITY * dt;
      if (this.vel.y > 0 && !jumpHeld && this.jumpBuffer <= 0) {
        this.vel.y *= Math.pow(JUMP_CUT, dt * 60);
      }
    }

    this.pos.x += this.vel.x * dt;
    this.pos.z += this.vel.z * dt;
    this.pos.y += this.vel.y * dt;

    if (this.pos.y <= 0) {
      this.pos.y = 0;
      if (!this.onGround) {
        const impact = Math.abs(this.vel.y);
        if (impact > 3.5) this.landTimer = this.landDuration;
        this.onGround = true;
      }
      this.vel.y = 0;
    } else {
      this.onGround = false;
    }

    if (hasInput && this.onGround && this.celebrateTimer <= 0) {
      this.targetYaw = Math.atan2(dx, dz);
    }
    const dYaw = shortestAngle(this.yaw, this.targetYaw);
    this.yaw += dYaw * Math.min(1, dt * 13);

    const horizSpeed = Math.hypot(this.vel.x, this.vel.z);
    this.speed = horizSpeed;
    if (this.onGround && this.celebrateTimer <= 0) {
      const strideLen = 1.9 + (horizSpeed / RUN_SPEED) * 0.7;
      this.cyclePhase = mod(this.cyclePhase + (horizSpeed / strideLen) * TAU * dt, TAU);
    }

    const margin = 8;
    this.pos.x = clamp(this.pos.x, PB.minX - margin, PB.maxX + margin);
    this.pos.z = clamp(this.pos.z, PB.minZ - margin, PB.maxZ + margin);

    this.rig.root.position.copy(this.pos);
    this.rig.root.rotation.y = this.yaw;
    applyPose(this.rig, computePose(this, dt));

    if (this.celebrateTimer > 0) {
      const e = this.rig.face.emote;
      const s = 1 + Math.sin(this.t * 12) * 0.10;
      e.scale.set(1.00 * s, 0.625 * s, 1);
    }

    const h = this.pos.y;
    const sc = clamp(1 - h * 0.22, 0.35, 1);
    this.rig.shadow.scale.set(0.42 * sc, 1, 0.42 * sc);
    this.rig.shadow.position.y = 0.02 - this.pos.y + h;
  }
}

/* ============================================================================
   16.  BALL
   ========================================================================== */
const BALL_R = 0.11;
const GROUND_Y = 0.02;

function makeBallTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#f4f2ea'; g.fillRect(0, 0, 128, 128);
  g.fillStyle = '#141414';
  const spots = [[22,22],[86,20],[54,62],[20,102],[88,104],[112,60],[0,60],[64,128],[64,-4]];
  for (const [cx, cy] of spots) {
    g.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI/2 + i * TAU/5;
      const px = cx + Math.cos(a) * 13, py = cy + Math.sin(a) * 13;
      if (i === 0) g.moveTo(px, py); else g.lineTo(px, py);
    }
    g.closePath(); g.fill();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 2;
  return tex;
}

const ball = {
  pos: new THREE.Vector3(PITCH.cx, GROUND_Y + BALL_R, PITCH.cz),
  prevPos: new THREE.Vector3(),
  vel: new THREE.Vector3(),
  mesh: null,
  goalCooldown: 0,
  resetTimer: 0,
  lastKicker: null,
  spinAxis: new THREE.Vector3()
};
{
  const geo = new THREE.SphereGeometry(BALL_R, 16, 12);
  const mat = new THREE.MeshLambertMaterial({ map: makeBallTexture() });
  ball.mesh = new THREE.Mesh(geo, mat);
  ball.mesh.position.copy(ball.pos);
  scene.add(ball.mesh);
}

const kickRing = new THREE.Mesh(
  new THREE.RingGeometry(0.28, 0.36, 20).rotateX(-Math.PI/2),
  new THREE.MeshBasicMaterial({ color:0xffd23f, transparent:true, opacity:0.85,
                                side:THREE.DoubleSide, depthWrite:false })
);
kickRing.visible = false;
scene.add(kickRing);

const FIXED_DT = 1/120;
let ballAccum = 0;

function resetBall() {
  ball.pos.set(PITCH.cx, GROUND_Y + BALL_R, PITCH.cz);
  ball.vel.set(0, 0, 0);
  ball.lastKicker = null;
}

function stepBall(dt) {
  ball.prevPos.copy(ball.pos);

  ball.vel.y -= 9.81 * dt;
  const sp = ball.vel.length();
  if (sp > 0.02) ball.vel.multiplyScalar(Math.exp(-0.20 * dt));
  ball.pos.addScaledVector(ball.vel, dt);

  const floor = GROUND_Y + BALL_R;
  if (ball.pos.y < floor) {
    ball.pos.y = floor;
    if (ball.vel.y < 0) {
      const impact = -ball.vel.y;
      if (impact > 1.2) playBounce(Math.min(1, impact / 9));
      ball.vel.y = impact * 0.55;
      ball.vel.x *= 0.86; ball.vel.z *= 0.86;
      if (Math.abs(ball.vel.y) < 0.55) ball.vel.y = 0;
    }
    const hs = Math.hypot(ball.vel.x, ball.vel.z);
    if (hs > 0.001) {
      const f = Math.exp(-1.45 * dt);
      ball.vel.x *= f; ball.vel.z *= f;
      if (hs < 0.09) { ball.vel.x = 0; ball.vel.z = 0; }
    }
  }

  const inGoalZ = Math.abs(ball.pos.z - PITCH.cz) < GOAL_W/2 + 0.02;
  const underBar = ball.pos.y < GOAL_H;

  if (ball.pos.x < PB.minX + BALL_R) {
    const insideGoal = inGoalZ && underBar && ball.pos.x > PB.minX - GOAL_DEPTH - 0.15;
    if (!insideGoal) { ball.pos.x = PB.minX + BALL_R; ball.vel.x = Math.abs(ball.vel.x) * 0.55; }
  }
  if (ball.pos.x > PB.maxX - BALL_R) {
    const insideGoal = inGoalZ && underBar && ball.pos.x < PB.maxX + GOAL_DEPTH + 0.15;
    if (!insideGoal) { ball.pos.x = PB.maxX - BALL_R; ball.vel.x = -Math.abs(ball.vel.x) * 0.55; }
  }
  if (ball.pos.z < PB.minZ + BALL_R) { ball.pos.z = PB.minZ + BALL_R; ball.vel.z = Math.abs(ball.vel.z) * 0.55; }
  if (ball.pos.z > PB.maxZ - BALL_R) { ball.pos.z = PB.maxZ - BALL_R; ball.vel.z = -Math.abs(ball.vel.z) * 0.55; }

  const westBox = ball.pos.x < PB.minX && ball.pos.x > PB.minX - GOAL_DEPTH;
  const eastBox = ball.pos.x > PB.maxX && ball.pos.x < PB.maxX + GOAL_DEPTH;
  if ((westBox || eastBox) && inGoalZ) {
    ball.vel.multiplyScalar(Math.exp(-7.5 * dt));
    const backX = westBox ? PB.minX - GOAL_DEPTH + BALL_R : PB.maxX + GOAL_DEPTH - BALL_R;
    if (westBox && ball.pos.x < backX) { ball.pos.x = backX; ball.vel.x = Math.abs(ball.vel.x) * 0.15; }
    if (eastBox && ball.pos.x > backX) { ball.pos.x = backX; ball.vel.x = -Math.abs(ball.vel.x) * 0.15; }
  }

  const collidePost = (px, pz) => {
    const ddx = ball.pos.x - px, ddz = ball.pos.z - pz;
    const d2 = ddx*ddx + ddz*ddz, minD = BALL_R + 0.07;
    if (d2 < minD*minD && d2 > 1e-9 && ball.pos.y < GOAL_H + 0.05) {
      const d = Math.sqrt(d2), nx = ddx/d, nz = ddz/d;
      ball.pos.x = px + nx*minD;
      ball.pos.z = pz + nz*minD;
      const vn = ball.vel.x*nx + ball.vel.z*nz;
      if (vn < 0) {
        ball.vel.x -= 1.6 * vn * nx;
        ball.vel.z -= 1.6 * vn * nz;
        playPost();
      }
    }
  };
  const zP1 = PITCH.cz - GOAL_W/2, zP2 = PITCH.cz + GOAL_W/2;
  collidePost(PB.minX, zP1); collidePost(PB.minX, zP2);
  collidePost(PB.maxX, zP1); collidePost(PB.maxX, zP2);

  if (ball.pos.y > GOAL_H - 0.20 && ball.pos.y < GOAL_H + 0.20) {
    for (const gx of [PB.minX, PB.maxX]) {
      if (Math.abs(ball.pos.x - gx) < BALL_R + 0.07 &&
          Math.abs(ball.pos.z - PITCH.cz) < GOAL_W/2) {
        ball.pos.y = GOAL_H - 0.20;
        ball.vel.y = Math.abs(ball.vel.y) * 0.55;
        playPost();
      }
    }
  }

  if (Math.abs(ball.pos.x - PITCH.cx) > 90 || Math.abs(ball.pos.z - PITCH.cz) > 90) resetBall();
}

function checkGoal() {
  if (ball.goalCooldown > 0) return;
  const gz0 = PITCH.cz - GOAL_W/2, gz1 = PITCH.cz + GOAL_W/2;
  const px = ball.prevPos.x, cx = ball.pos.x;

  const crossed = (plane, dir) => {
    if (dir > 0 ? (px < plane && cx >= plane) : (px > plane && cx <= plane)) {
      const t = (plane - px) / (cx - px);
      const zc = ball.prevPos.z + (ball.pos.z - ball.prevPos.z) * t;
      const yc = ball.prevPos.y + (ball.pos.y - ball.prevPos.y) * t;
      if (zc > gz0 && zc < gz1 && yc > 0 && yc < GOAL_H) return true;
    }
    return false;
  };

  if (crossed(PB.minX, -1)) { onGoal(TEAM.RED); return; }
  if (crossed(PB.maxX,  1)) { onGoal(TEAM.BLUE); return; }
}

/* ============================================================================
   17.  GOAL + CELEBRATION
   ========================================================================== */
const goalFlashEl = document.getElementById('goalFlash');
const scoreTextEl = document.getElementById('scoreText');

function updateScoreHUD() {
  scoreTextEl.textContent = `${teamScore[0]} – ${teamScore[1]}`;
}

function onGoal(scoringTeam) {
  teamScore[scoringTeam]++;
  updateScoreHUD();

  ball.goalCooldown = 3.2;
  ball.resetTimer = 2.4;

  const all = [player, ...npcs];
  for (const ch of all) {
    if (ch.team === scoringTeam) ch.celebrate();
  }
  teamCelebrate[scoringTeam] = 2.6;

  playCheer();

  const mine = scoringTeam === player.team;
  goalFlashEl.textContent = mine ? 'SUU!  GOAL!' : `${TEAM_NAME[scoringTeam]} GOAL`;
  goalFlashEl.classList.toggle('opp', !mine);
  goalFlashEl.classList.remove('show');
  void goalFlashEl.offsetWidth;
  goalFlashEl.classList.add('show');
}
updateScoreHUD();

function updateBall(dt) {
  if (ball.goalCooldown > 0) ball.goalCooldown -= dt;
  if (ball.resetTimer > 0) {
    ball.resetTimer -= dt;
    if (ball.resetTimer <= 0) resetBall();
  }
  ballAccum += dt;
  let steps = 0;
  while (ballAccum >= FIXED_DT && steps < 8) {
    stepBall(FIXED_DT);
    checkGoal();
    ballAccum -= FIXED_DT;
    steps++;
  }
  if (steps === 8) ballAccum = 0;

  ball.mesh.position.copy(ball.pos);
  const vx = ball.vel.x, vz = ball.vel.z;
  const hs = Math.hypot(vx, vz);
  if (hs > 0.02) {
    ball.spinAxis.set(vz, 0, -vx).normalize();
    ball.mesh.rotateOnWorldAxis(ball.spinAxis, (hs * dt) / BALL_R);
  }
}

/* ============================================================================
   18.  INPUT
   ========================================================================== */
const keys = Object.create(null);
let wantJumpThisFrame = false;

addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (!keys[k] && (k === ' ' || k === 'w' || k === 'a' || k === 's' || k === 'd' ||
      k.startsWith('arrow'))) ensureAudio();
  keys[k] = true;
  if (k === ' ' || k.startsWith('arrow')) e.preventDefault();
  if (k === ' ' && !e.repeat) { wantJumpThisFrame = true; player.jump(); }
  if (k === 'f' && !e.repeat) doPlayerKick();
});
addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

const joyZone = document.getElementById('joyZone');
const joyBase = document.getElementById('joyBase');
const joyKnob = document.getElementById('joyKnob');
let joyId = null;
let joyOriginX = 0, joyOriginY = 0;
let joyDX = 0, joyDY = 0;
const JOY_RADIUS = 60;

function joyStart(e) {
  if (joyId !== null) return;
  e.preventDefault();
  ensureAudio();
  joyId = e.pointerId;
  joyOriginX = e.clientX;
  joyOriginY = e.clientY;
  joyBase.style.left = joyOriginX + 'px';
  joyBase.style.top  = joyOriginY + 'px';
  joyKnob.style.left = joyOriginX + 'px';
  joyKnob.style.top  = joyOriginY + 'px';
  joyBase.classList.add('on');
  joyKnob.classList.add('on');
  joyZone.setPointerCapture(e.pointerId);
}
function joyMove(e) {
  if (e.pointerId !== joyId) return;
  e.preventDefault();
  let dx = e.clientX - joyOriginX;
  let dy = e.clientY - joyOriginY;
  const d = Math.hypot(dx, dy);
  if (d > JOY_RADIUS) { dx = dx / d * JOY_RADIUS; dy = dy / d * JOY_RADIUS; }
  joyKnob.style.left = (joyOriginX + dx) + 'px';
  joyKnob.style.top  = (joyOriginY + dy) + 'px';
  joyDX = dx / JOY_RADIUS;
  joyDY = -dy / JOY_RADIUS;
}
function joyEnd(e) {
  if (e.pointerId !== joyId) return;
  e.preventDefault();
  joyId = null;
  joyDX = 0; joyDY = 0;
  joyBase.classList.remove('on');
  joyKnob.classList.remove('on');
}
joyZone.addEventListener('pointerdown', joyStart);
joyZone.addEventListener('pointermove', joyMove);
joyZone.addEventListener('pointerup', joyEnd);
joyZone.addEventListener('pointercancel', joyEnd);
joyZone.addEventListener('pointerleave', joyEnd);

const btnJump = document.getElementById('btnJump');
const btnKick = document.getElementById('btnKick');
let jumpPointer = null;

btnJump.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  ensureAudio();
  jumpPointer = e.pointerId;
  btnJump.classList.add('down');
  btnJump.setPointerCapture(e.pointerId);
  wantJumpThisFrame = true;
  player.jump();
});
btnJump.addEventListener('pointerup', (e) => {
  e.preventDefault();
  if (e.pointerId !== jumpPointer) return;
  jumpPointer = null;
  btnJump.classList.remove('down');
  player.releaseJump();
});
btnJump.addEventListener('pointercancel', () => {
  jumpPointer = null;
  btnJump.classList.remove('down');
  player.releaseJump();
});

btnKick.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  ensureAudio();
  btnKick.classList.add('down');
  btnKick.setPointerCapture(e.pointerId);
  doPlayerKick();
});
btnKick.addEventListener('pointerup',   () => btnKick.classList.remove('down'));
btnKick.addEventListener('pointercancel',() => btnKick.classList.remove('down'));

const camState = {
  yaw: 0, pitch: 0.45, dist: 7.5,
  targetYaw: 0, targetPitch: 0.45, targetDist: 7.5
};
let camPointer = null, camLastX = 0, camLastY = 0;

renderer.domElement.addEventListener('pointerdown', (e) => {
  if (camPointer !== null) return;
  e.preventDefault();
  camPointer = e.pointerId;
  camLastX = e.clientX; camLastY = e.clientY;
  renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointermove', (e) => {
  if (e.pointerId !== camPointer) return;
  e.preventDefault();
  const dx = e.clientX - camLastX, dy = e.clientY - camLastY;
  camLastX = e.clientX; camLastY = e.clientY;
  camState.targetYaw   -= dx * 0.006;
  camState.targetPitch = clamp(camState.targetPitch + dy * 0.005, 0.12, 1.35);
});
renderer.domElement.addEventListener('pointerup', (e) => {
  if (e.pointerId !== camPointer) return;
  camPointer = null;
});
renderer.domElement.addEventListener('pointercancel', (e) => {
  if (e.pointerId !== camPointer) return;
  camPointer = null;
});
renderer.domElement.addEventListener('wheel', (e) => {
  e.preventDefault();
  camState.targetDist = clamp(camState.targetDist + e.deltaY * 0.008, 4, 16);
}, { passive: false });

let pinchStart = 0, pinchStartDist = 0;
renderer.domElement.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) {
    pinchStart = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY);
    pinchStartDist = camState.targetDist;
  }
}, { passive: false });
renderer.domElement.addEventListener('touchmove', (e) => {
  if (e.touches.length === 2 && pinchStart > 0) {
    e.preventDefault();
    const d = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY);
    camState.targetDist = clamp(pinchStartDist * (pinchStart / d), 4, 16);
  }
}, { passive: false });
renderer.domElement.addEventListener('touchend', (e) => {
  if (e.touches.length < 2) pinchStart = 0;
});

const KICK_RANGE = 1.6;
function doPlayerKick() {
  if (player.celebrateTimer > 0) return;
  const dx = ball.pos.x - player.pos.x;
  const dz = ball.pos.z - player.pos.z;
  const d = Math.hypot(dx, dz);
  if (d > KICK_RANGE || ball.pos.y > 1.6) return;

  player.kick();

  let nx = dx / (d || 1), nz = dz / (d || 1);
  const fx = Math.sin(player.yaw), fz = Math.cos(player.yaw);
  nx = nx * 0.72 + fx * 0.28;
  nz = nz * 0.72 + fz * 0.28;
  const nl = Math.hypot(nx, nz) || 1;
  nx /= nl; nz /= nl;

  const runBonus = clamp(player.speed / RUN_SPEED, 0, 1);
  const power = 11.0 + runBonus * 4.5;
  const vy = 3.4 + rnd() * 1.8;

  ball.vel.set(nx * power, vy, nz * power);
  ball.lastKicker = player;
  playKick(1.0);
}

function playerBallPush() {
  if (player.celebrateTimer > 0) return;
  const dx = ball.pos.x - player.pos.x;
  const dz = ball.pos.z - player.pos.z;
  const d = Math.hypot(dx, dz);
  const minD = 0.42 + BALL_R;
  if (d < minD && d > 1e-4 && ball.pos.y < 1.1) {
    const nx = dx / d, nz = dz / d;
    ball.pos.x = player.pos.x + nx * minD;
    ball.pos.z = player.pos.z + nz * minD;
    const vn = ball.vel.x * nx + ball.vel.z * nz;
    if (vn < 0) { ball.vel.x -= vn * nx * 1.25; ball.vel.z -= vn * nz * 1.25; }
    ball.vel.x += nx * 1.4;
    ball.vel.z += nz * 1.4;
    player.vel.x -= nx * 0.6;
    player.vel.z -= nz * 0.6;
  }
}

/* ============================================================================
   19.  TEAM AI
   ========================================================================== */
function updateNPCs(dt) {
  const chaser = [null, null];
  const chaserD = [Infinity, Infinity];
  for (const ch of npcs) {
    if (ch.celebrateTimer > 0) continue;
    const d = Math.hypot(ball.pos.x - ch.pos.x, ball.pos.z - ch.pos.z);
    if (d < chaserD[ch.team]) { chaserD[ch.team] = d; chaser[ch.team] = ch; }
  }

  for (const ch of npcs) {
    ch.kickCd -= dt;

    if (ch.celebrateTimer > 0) {
      ch.update(dt, 0, 0, false, false);
      continue;
    }

    const targetGoalX = TEAM_SCORE_GOAL[ch.team];
    const ownGoalX    = TEAM_OWN_GOAL[ch.team];

    let wishX = 0, wishZ = 0;
    let wantKick = false;

    const bx = ball.pos.x, bz = ball.pos.z;
    const dx = bx - ch.pos.x, dz = bz - ch.pos.z;
    const dist = Math.hypot(dx, dz);

    if (ch === chaser[ch.team]) {
      if (dist > 0.9) {
        wishX = dx / dist;
        wishZ = dz / dist;
      } else if (ch.kickCd <= 0) {
        wantKick = true;
      }
    } else {
      const tx = lerp(ownGoalX, bx, 0.45);
      const tz = lerp(PITCH.cz, bz, 0.55);
      const sdx = tx - ch.pos.x, sdz = tz - ch.pos.z;
      const sd = Math.hypot(sdx, sdz);
      if (sd > 1.3) {
        wishX = (sdx / sd) * 0.65;
        wishZ = (sdz / sd) * 0.65;
      }
    }

    ch.update(dt, wishX, wishZ, false, false);

    if (wantKick) {
      ch.kick();

      const gdx = targetGoalX - bx;
      const gdz = PITCH.cz - bz;
      const baseAng = Math.atan2(gdx, gdz);
      const ang = baseAng + (rnd() - 0.5) * 0.42;
      const power = 9.5 + rnd() * 4.0;

      ball.vel.set(Math.sin(ang) * power, 2.6 + rnd() * 2.0, Math.cos(ang) * power);
      ball.lastKicker = ch;
      ch.kickCd = 1.4 + rnd() * 1.6;
      playKick(0.6);
    }
  }

  const all = [player, ...npcs];
  for (let i = 0; i < all.length; i++) {
    for (let j = i + 1; j < all.length; j++) {
      const a = all[i], b = all[j];
      if (a.celebrateTimer > 0 && b.celebrateTimer > 0) continue;
      const dx = a.pos.x - b.pos.x, dz = a.pos.z - b.pos.z;
      const d2 = dx*dx + dz*dz;
      const minD = 0.55;
      if (d2 < minD*minD && d2 > 1e-6) {
        const d = Math.sqrt(d2);
        const push = (minD - d) * 0.5;
        const nx = dx / d, nz = dz / d;
        a.pos.x += nx * push; a.pos.z += nz * push;
        b.pos.x -= nx * push; b.pos.z -= nz * push;
      }
    }
  }
}

/* ============================================================================
   20.  CAMERA
   ========================================================================== */
const camLookAt = new THREE.Vector3();
const camDesired = new THREE.Vector3();
const camFwd = new THREE.Vector3();
const camRight = new THREE.Vector3();
const WORLD_UP = new THREE.Vector3(0, 1, 0);

function updateCamera(dt) {
  camState.yaw   = damp(camState.yaw,   camState.targetYaw,   10, dt);
  camState.pitch = damp(camState.pitch, camState.targetPitch, 10, dt);
  camState.dist  = damp(camState.dist,  camState.targetDist,  8,  dt);

  const px = player.pos.x;
  const pz = player.pos.z;
  const py = 1.10;

  camLookAt.set(px, py, pz);

  const yaw = camState.yaw, pitch = camState.pitch, d = camState.dist;
  const horiz = Math.cos(pitch) * d;
  const vy = Math.sin(pitch) * d;

  camDesired.set(
    px + Math.sin(yaw) * horiz,
    py + vy,
    pz + Math.cos(yaw) * horiz
  );
  if (camDesired.y < 0.6) camDesired.y = 0.6;

  camera.position.lerp(camDesired, 1 - Math.exp(-dt * 8));
  camera.lookAt(camLookAt);

  camFwd.set(px - camera.position.x, 0, pz - camera.position.z);
  if (camFwd.lengthSq() < 1e-6) camFwd.set(0, 0, -1);
  camFwd.normalize();
  camRight.crossVectors(camFwd, WORLD_UP).normalize();
}

/* ============================================================================
   21.  MAIN LOOP
   ========================================================================== */
const statEl = document.getElementById('stat');
let last = performance.now();
let simTime = 0;
let fpsAcc = 0, fpsFrames = 0, fps = 0;
const SIGNAL_NAMES = ['RING GREEN','RING YELLOW','ALL RED','CROSS GREEN','CROSS YELLOW'];

function loop(now) {
  requestAnimationFrame(loop);

  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  simTime += dt;

  const st = lightState(simTime);
  paintLights(st);
  updateRingTraffic(dt, simTime, st);
  updateCrossTraffic(dt, simTime, st);
  for (const lane of LANES)       for (const v of lane.veh) placeRingVehicle(v, dt, simTime);
  for (const lane of CROSS_LANES) for (const v of lane.veh) placeCrossVehicle(v, dt);

  for (let i = 0; i < vendorGroups.length; i++) {
    const m = vendorGroups[i];
    m.position.y = m.userData.baseY + Math.sin(simTime * 1.6 + m.userData.phase) * 0.035;
  }

  let ix = 0, iz = 0;
  if (keys['w'] || keys['arrowup'])    iz += 1;
  if (keys['s'] || keys['arrowdown'])  iz -= 1;
  if (keys['a'] || keys['arrowleft'])  ix -= 1;
  if (keys['d'] || keys['arrowright']) ix += 1;

  if (joyId !== null || Math.abs(joyDX) > 0.001 || Math.abs(joyDY) > 0.001) {
    ix = joyDX; iz = joyDY;
  }

  let wishX = camFwd.x * iz + camRight.x * ix;
  let wishZ = camFwd.z * iz + camRight.z * ix;
  const m = Math.hypot(wishX, wishZ);
  if (m > 1) { wishX /= m; wishZ /= m; }

  const jumpHeld = !!keys[' '] || jumpPointer !== null;

  player.update(dt, wishX, wishZ, wantJumpThisFrame, jumpHeld);
  wantJumpThisFrame = false;

  playerBallPush();
  updateNPCs(dt);
  updateBall(dt);

  const bdx = ball.pos.x - player.pos.x;
  const bdz = ball.pos.z - player.pos.z;
  const bd = Math.hypot(bdx, bdz);
  const inRange = bd < KICK_RANGE && ball.pos.y < 1.6 && player.celebrateTimer <= 0;
  kickRing.visible = inRange;
  if (inRange) {
    kickRing.position.set(ball.pos.x, GROUND_Y + 0.03, ball.pos.z);
    const s = 1 + Math.sin(simTime * 8) * 0.08;
    kickRing.scale.set(s, 1, s);
  }
  btnKick.classList.toggle('hot', inRange);

  updateCamera(dt);
  renderer.render(scene, camera);

  fpsAcc += dt; fpsFrames++;
  if (fpsAcc > 0.5) { fps = Math.round(fpsFrames / fpsAcc); fpsAcc = 0; fpsFrames = 0; }

  statEl.innerHTML =
    `fps <b>${fps}</b> · ` +
    `<span style="color:#ff8575">RED</span> <b>${teamScore[0]}</b>` +
    ` – ` +
    `<b>${teamScore[1]}</b> <span style="color:#9ecfff">ARG</span> · ` +
    `spd <b>${player.speed.toFixed(1)}</b> ` +
    `${player.onGround ? '' : '<span style="color:#8ee6ff">AIR</span>'} ` +
    `${player.celebrateTimer > 0 ? '<span style="color:#ffd23f">SUU!</span>' : ''} · ` +
    `${SIGNAL_NAMES[st]}`;
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

requestAnimationFrame(loop);

['pointerdown', 'touchstart', 'keydown'].forEach(evt =>
  addEventListener(evt, ensureAudio, { once: true, passive: true }));
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000">
<title>Home</title>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  html,body{
    width:100%;height:100%;overflow:hidden;background:#0a0a12;
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    user-select:none;-webkit-user-select:none;
    touch-action:none;
  }

  /* ---- Desktop: iPhone 14 Pro frame ---- */
  body{
    display:flex;align-items:center;justify-content:center;min-height:100vh;
    background:radial-gradient(ellipse at center,#1a1a2e 0%,#050508 100%);
  }
  #phone{
    position:relative;
    width:min(430px,100vw);
    height:min(932px,100vh);
    height:min(932px,100dvh);
    background:#000;
    border-radius:min(56px,12vw);
    overflow:hidden;
    box-shadow:
      0 0 0 12px #111,
      0 0 0 15px #262626,
      0 30px 90px rgba(0,0,0,.85),
      0 0 0 1px rgba(255,255,255,.06) inset;
  }
  @media (max-width:520px),(max-height:740px){
    body{background:#000}
    #phone{width:100vw;height:100vh;height:100dvh;border-radius:0;box-shadow:none}
  }

  /* ---- Wallpaper ---- */
  #wallpaper{
    position:absolute;inset:0;
    background:
      radial-gradient(circle at 20% 15%,rgba(120,80,255,.35) 0%,transparent 42%),
      radial-gradient(circle at 85% 75%,rgba(255,80,120,.28) 0%,transparent 45%),
      radial-gradient(circle at 60% 40%,rgba(0,200,255,.20) 0%,transparent 55%),
      linear-gradient(160deg,#0d0b1f 0%,#1a1230 45%,#08060f 100%);
    z-index:0;
  }
  #wallpaper::before,#wallpaper::after{
    content:'';position:absolute;border-radius:50%;filter:blur(60px);opacity:.4;
  }
  #wallpaper::before{width:280px;height:280px;background:#5b3fff;top:-60px;left:-40px}
  #wallpaper::after{width:320px;height:320px;background:#ff4f7a;bottom:-100px;right:-70px}

  /* ---- Dynamic Island ---- */
  #island{
    position:absolute;top:calc(11px + env(safe-area-inset-top,0px));
    left:50%;transform:translateX(-50%);
    width:124px;height:35px;background:#000;border-radius:20px;z-index:60;
    pointer-events:none;
    box-shadow:0 0 0 1px rgba(255,255,255,.04);
  }
  @media (max-width:520px),(max-height:740px){
    #island{width:110px;height:32px;top:calc(8px + env(safe-area-inset-top,0px))}
  }

  /* ---- Status bar ---- */
  #statusbar{
    position:absolute;top:0;left:0;right:0;
    height:calc(52px + env(safe-area-inset-top,0px));
    padding-top:env(safe-area-inset-top,0px);
    display:flex;align-items:center;justify-content:space-between;
    padding-left:26px;padding-right:26px;z-index:55;pointer-events:none;
    color:#fff;font-size:14px;font-weight:600;letter-spacing:.2px;
    text-shadow:0 1px 2px rgba(0,0,0,.35);
  }
  #statusbar .right{display:flex;align-items:center;gap:5px}
  #statusbar svg{display:block}
  @media (max-width:520px),(max-height:740px){
    #statusbar{padding-left:20px;padding-right:20px;height:calc(46px + env(safe-area-inset-top,0px));font-size:13px}
  }

  /* ---- Home screen ---- */
  #homescreen{
    position:absolute;inset:0;z-index:5;
    padding:calc(58px + env(safe-area-inset-top,0px)) 22px
            calc(34px + env(safe-area-inset-bottom,0px));
    display:flex;flex-direction:column;
    transition:transform .45s cubic-bezier(.32,.72,0,1),opacity .3s;
    transform-origin:50% 50%;
  }
  #homescreen.hidden{
    transform:scale(1.12);opacity:0;pointer-events:none;
  }

  #widget{
    text-align:center;color:#fff;margin:14px 0 34px;
    text-shadow:0 2px 14px rgba(0,0,0,.55);
  }
  #widgetDate{
    font-size:14px;font-weight:600;letter-spacing:.4px;
    color:rgba(255,255,255,.85);margin-bottom:2px;
  }
  #widgetTime{
    font-size:76px;font-weight:200;letter-spacing:-3px;line-height:1;
    font-variant-numeric:tabular-nums;
  }
  @media (max-height:740px){
    #widget{margin:8px 0 22px}
    #widgetTime{font-size:62px}
  }

  #appgrid{
    display:grid;grid-template-columns:repeat(4,1fr);
    gap:22px 18px;flex:1;align-content:start;
    margin-top:6px;
  }
  .app{
    background:none;border:none;padding:0;font:inherit;color:inherit;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    cursor:pointer;-webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    transition:transform .12s;
  }
  .app:active{transform:scale(.9)}
  .app:active .icon{filter:brightness(.85)}

  .icon{
    width:60px;height:60px;border-radius:14px;
    overflow:hidden;position:relative;
    box-shadow:
      0 4px 14px rgba(0,0,0,.45),
      0 0 0 .5px rgba(255,255,255,.10) inset;
    background:#1a1a1a;
  }
  .icon svg{width:100%;height:100%;display:block}
  .app-label{
    font-size:11px;font-weight:500;color:#fff;
    letter-spacing:.1px;max-width:72px;text-align:center;
    line-height:1.15;
    text-shadow:0 1px 3px rgba(0,0,0,.9);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  @media (max-width:520px){
    #appgrid{grid-template-columns:repeat(4,1fr);gap:20px 14px}
    .icon{width:54px;height:54px;border-radius:13px}
    .app-label{font-size:10px;max-width:64px}
  }

  #dock{
    margin-top:auto;margin-left:-22px;margin-right:-22px;margin-bottom:-10px;
    padding:12px 22px calc(14px + env(safe-area-inset-bottom,0px));
    display:grid;grid-template-columns:repeat(4,1fr);
    gap:18px;align-content:center;
    background:rgba(30,30,45,.42);
    backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
    border-top:.5px solid rgba(255,255,255,.12);
    border-radius:36px 36px 0 0;
  }
  #dock .icon{box-shadow:0 4px 12px rgba(0,0,0,.55),0 0 0 .5px rgba(255,255,255,.12) inset}
  @media (max-width:520px){
    #dock{gap:14px;padding:10px 18px calc(12px + env(safe-area-inset-bottom,0px))}
  }

  /* ---- App view (fullscreen iframe) ---- */
  #appview{
    position:absolute;inset:0;z-index:40;
    background:#000;
    opacity:0;transform:scale(.9);pointer-events:none;
    transition:opacity .35s ease,transform .45s cubic-bezier(.32,.72,0,1);
  }
  #appview.on{opacity:1;transform:scale(1);pointer-events:auto}
  #appview iframe{
    width:100%;height:100%;border:0;display:block;background:#000;
  }

  /* ---- Floating BACK button (top-left, safe area aware) ---- */
  #backbtn{
    position:absolute;
    top:calc(env(safe-area-inset-top,0px) + 52px);
    left:14px;
    z-index:80;
    display:none;
    align-items:center;gap:6px;
    padding:9px 14px 9px 10px;
    border-radius:999px;
    background:rgba(20,20,28,.78);
    border:1px solid rgba(255,255,255,.20);
    color:#fff;font:800 12px/1 -apple-system,BlinkMacSystemFont,'SF Pro Display',system-ui,sans-serif;
    letter-spacing:1.4px;text-transform:uppercase;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 6px 22px rgba(0,0,0,.55);
    cursor:pointer;-webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    transition:transform .12s,background .2s;
  }
  #backbtn.on{display:inline-flex}
  #backbtn:active{transform:scale(.94);background:rgba(255,210,63,.9);color:#3a2400}
  #backbtn svg{display:block;flex-shrink:0}

  /* ---- Home indicator (raised above safe area so the browser bar can't hide it) ---- */
  #homeindicator{
    position:absolute;
    bottom:calc(env(safe-area-inset-bottom,0px) + 8px);
    left:50%;transform:translateX(-50%);
    width:140px;height:5px;border-radius:3px;background:#fff;
    opacity:.22;z-index:70;cursor:pointer;
    transition:opacity .25s,background .25s;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    padding:14px 0;                 /* invisible tap area */
    background-clip:content-box;
    background-color:#fff;
  }
  #appview.on ~ #homeindicator{opacity:.9}
  #homeindicator:active{background-color:#ffd23f;opacity:1}

  /* ---- Launch flash overlay ---- */
  #flash{
    position:absolute;inset:0;background:#000;z-index:65;
    opacity:0;pointer-events:none;transition:opacity .25s;
  }
  #flash.on{opacity:1}
</style>
</head>
<body>

<div id="phone">
  <div id="wallpaper"></div>

  <!-- Dynamic Island -->
  <div id="island"></div>

  <!-- Status bar -->
  <div id="statusbar">
    <span id="statusTime">9:41</span>
    <div class="right">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="#fff">
        <rect x="0"  y="8" width="3" height="4" rx=".8"/>
        <rect x="4.5" y="6" width="3" height="6" rx=".8"/>
        <rect x="9"  y="3" width="3" height="9" rx=".8"/>
        <rect x="13.5" y="0" width="3" height="12" rx=".8"/>
      </svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round">
        <path d="M1 4.2C3 2.3 5.4 1.3 8 1.3s5 .9 7 2.9"/>
        <path d="M3.4 7c1.4-1.3 3-2 4.6-2s3.2.7 4.6 2"/>
        <path d="M5.8 9.5c.7-.6 1.4-1 2.2-1s1.5.4 2.2 1"/>
      </svg>
      <svg width="26" height="13" viewBox="0 0 26 13" fill="none">
        <rect x="0.5" y="0.5" width="22" height="12" rx="3.2" stroke="#fff" stroke-opacity=".55"/>
        <rect x="2.5" y="2.5" width="15" height="8" rx="1.6" fill="#fff"/>
        <path d="M23.6 4v5a2 2 0 0 0 0-5z" fill="#fff" fill-opacity=".55"/>
      </svg>
    </div>
  </div>

  <!-- Home screen -->
  <div id="homescreen">
    <div id="widget">
      <div id="widgetDate">Monday, January 1</div>
      <div id="widgetTime">9:41</div>
    </div>

    <div id="appgrid">
      <button class="app" data-app="dobo" aria-label="Launch DOBO">
        <div class="icon">
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="doboBg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#0a0a15"/>
                <stop offset="1" stop-color="#1a0e2a"/>
              </linearGradient>
              <linearGradient id="doboRing" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0"  stop-color="#00d9ff"/>
                <stop offset="55%" stop-color="#a78bfa"/>
                <stop offset="100%" stop-color="#ff6b35"/>
              </linearGradient>
            </defs>
            <rect width="100" height="100" fill="url(#doboBg)"/>
            <ellipse cx="50" cy="52" rx="34" ry="22"
                     fill="none" stroke="url(#doboRing)" stroke-width="8" opacity=".95"/>
            <ellipse cx="50" cy="52" rx="34" ry="22"
                     fill="none" stroke="url(#doboRing)" stroke-width="8"
                     transform="rotate(58 50 52)" opacity=".55"/>
            <ellipse cx="50" cy="52" rx="34" ry="22"
                     fill="none" stroke="url(#doboRing)" stroke-width="8"
                     transform="rotate(-58 50 52)" opacity=".55"/>
            <circle cx="50" cy="52" r="5" fill="#fff" opacity=".9"/>
          </svg>
        </div>
        <span class="app-label">DOBO</span>
      </button>

      <button class="app" data-app="eph" aria-label="Launch Portharcourt EPH">
        <div class="icon">
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="ephBg" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#7ab0e0"/>
                <stop offset="1" stop-color="#2a4a70"/>
              </linearGradient>
            </defs>
            <rect width="100" height="100" fill="url(#ephBg)"/>
            <rect x="0" y="0"  width="100" height="12.5" fill="#3f8a3a"/>
            <rect x="0" y="25" width="100" height="12.5" fill="#3f8a3a"/>
            <rect x="0" y="50" width="100" height="12.5" fill="#3f8a3a"/>
            <rect x="0" y="75" width="100" height="12.5" fill="#3f8a3a"/>
            <circle cx="50" cy="50" r="24" fill="#f4f2ea"/>
            <path d="M50 26 L62 34 L58 48 L42 48 L38 34 Z" fill="#141414"/>
            <path d="M42 48 L58 48 L64 60 L50 68 L36 60 Z" fill="#141414" opacity=".75"/>
            <rect x="6" y="6" width="20" height="20" rx="5" fill="#111" stroke="#ffd23f" stroke-width="2"/>
            <text x="16" y="21" font-size="11" font-family="monospace" font-weight="900"
                  fill="#ffd23f" text-anchor="middle">eph</text>
          </svg>
        </div>
        <span class="app-label">PORTHARCOURT</span>
      </button>
    </div>

    <div id="dock">
      <button class="app" data-app="dobo" aria-label="DOBO from dock">
        <div class="icon">
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="doboBg2" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#0a0a15"/>
                <stop offset="1" stop-color="#1a0e2a"/>
              </linearGradient>
              <linearGradient id="doboRing2" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#00d9ff"/>
                <stop offset="1" stop-color="#ff6b35"/>
              </linearGradient>
            </defs>
            <rect width="100" height="100" fill="url(#doboBg2)"/>
            <ellipse cx="50" cy="52" rx="34" ry="22"
                     fill="none" stroke="url(#doboRing2)" stroke-width="9"/>
          </svg>
        </div>
        <span class="app-label">DOBO</span>
      </button>
      <button class="app" data-app="eph" aria-label="EPH from dock">
        <div class="icon">
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="ephBg2" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#7ab0e0"/>
                <stop offset="1" stop-color="#2a4a70"/>
              </linearGradient>
            </defs>
            <rect width="100" height="100" fill="url(#ephBg2)"/>
            <rect x="0" y="0" width="100" height="10" fill="#3f8a3a"/>
            <rect x="0" y="30" width="100" height="10" fill="#3f8a3a"/>
            <rect x="0" y="60" width="100" height="10" fill="#3f8a3a"/>
            <circle cx="50" cy="50" r="26" fill="#f4f2ea"/>
            <path d="M50 24 L64 34 L58 50 L42 50 L36 34 Z" fill="#141414"/>
          </svg>
        </div>
        <span class="app-label">PORTHARCOURT</span>
      </button>
      <div></div><div></div>
    </div>
  </div>

  <!-- App view -->
  <div id="appview">
    <iframe id="gameframe" allow="autoplay; fullscreen; xr-spatial-tracking"
            allowfullscreen></iframe>
  </div>

  <!-- Floating back button (over the game) -->
  <button id="backbtn" aria-label="Back to home">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 5 L8 12 L15 19"/>
    </svg>
    HOME
  </button>

  <!-- Launch flash -->
  <div id="flash"></div>

  <!-- Home indicator -->
  <div id="homeindicator" role="button" aria-label="Return home"></div>
</div>

<script>
(function(){
  'use strict';

  const homescreen = document.getElementById('homescreen');
  const appview    = document.getElementById('appview');
  const iframe     = document.getElementById('gameframe');
  const flash      = document.getElementById('flash');
  const homeInd    = document.getElementById('homeindicator');
  const backbtn    = document.getElementById('backbtn');
  const statusTime = document.getElementById('statusTime');
  const widgetTime = document.getElementById('widgetTime');
  const widgetDate = document.getElementById('widgetDate');

  /* ---------- Clock / date ---------- */
  const DAYS   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const MONTHS = ['January','February','March','April','May','June',
                  'July','August','September','October','November','December'];
  function tick(){
    const now = new Date();
    const h   = now.getHours();
    const m   = String(now.getMinutes()).padStart(2,'0');
    const hh  = h % 12 || 12;
    const t   = hh + ':' + m;
    statusTime.textContent = t;
    widgetTime.textContent = t;
    widgetDate.textContent = DAYS[now.getDay()] + ', ' +
                             MONTHS[now.getMonth()] + ' ' + now.getDate();
  }
  tick();
  setInterval(tick, 1000);

  /* ---------- App registry ---------- */
  const APPS = {
    dobo: { file: 'dobo.html', title: 'DOBO' },
    eph : { file: 'eph.html',  title: 'Portharcourt EPH' }
  };
  let currentApp = null;

  /* ---------- Launch ---------- */
  function launchApp(name){
    const app = APPS[name];
    if (!app || currentApp) return;
    currentApp = name;
    flash.classList.add('on');
    iframe.src = app.file;

    setTimeout(() => {
      homescreen.classList.add('hidden');
      appview.classList.add('on');
      backbtn.classList.add('on');
      document.title = app.title;
      setTimeout(() => flash.classList.remove('on'), 60);
    }, 180);
  }

  /* ---------- Return home ---------- */
  function goHome(){
    if (!currentApp) return;
    flash.classList.add('on');

    setTimeout(() => {
      appview.classList.remove('on');
      backbtn.classList.remove('on');
      homescreen.classList.remove('hidden');
      document.title = 'Home';

      setTimeout(() => {
        iframe.src = 'about:blank';
        currentApp = null;
        flash.classList.remove('on');
      }, 320);
    }, 150);
  }

  /* ---------- Wire up taps ---------- */
  document.querySelectorAll('.app').forEach(el => {
    el.addEventListener('click', () => {
      const name = el.dataset.app;
      if (name) launchApp(name);
    });
  });

  /* Back button (top-left) */
  backbtn.addEventListener('click', (e) => { e.stopPropagation(); goHome(); });
  backbtn.addEventListener('pointerdown', (e) => { e.stopPropagation(); }, { passive: true });

  /* Home indicator tap */
  homeInd.addEventListener('click', (e) => { e.stopPropagation(); goHome(); });
  homeInd.addEventListener('pointerdown', (e) => {
    e.preventDefault(); e.stopPropagation(); goHome();
  }, { passive: false });

  /* Swipe up from bottom to go home */
  let swipeStartY = null;
  document.addEventListener('touchstart', (e) => {
    if (!currentApp) return;
    const t = e.touches[0];
    const rect = appview.getBoundingClientRect();
    if (rect.bottom - t.clientY < 100) swipeStartY = t.clientY;
  }, { passive: true });
  document.addEventListener('touchend', (e) => {
    if (swipeStartY === null) return;
    const endY = e.changedTouches[0].clientY;
    if (swipeStartY - endY > 55) goHome();
    swipeStartY = null;
  }, { passive: true });

  /* Escape on desktop */
  addEventListener('keydown', (e) => { if (e.key === 'Escape') goHome(); });

  /* Prefetch both games so launch feels instant */
  ['dobo.html','eph.html'].forEach(url => {
    const l = document.createElement('link');
    l.rel = 'prefetch'; l.href = url;
    document.head.appendChild(l);
  });

  console.log('%c HOME ', 'background:#ffd23f;color:#000;font-weight:900;padding:3px 8px;border-radius:4px;', 'Ready · 2 apps installed');
})();
</script>
</body>
 </html>

<!-- Visitor counter (localStorage gated) -->
<script>
(function () {
  const KEY   = 'eph_portharcourt_counted_v1';
  const SLUG  = 'portharcourt-eph';
  const URL   = 'https://api.visitorbadge.io/api/visitors' +
                '?path=' + encodeURIComponent(SLUG) +
                '&label=&countColor=%23ffd23f&labelColor=%23ffd23f&style=flat';
  const slot  = document.getElementById('visitorSlot');
  const label = document.getElementById('visitorLabel');
  const dot   = document.getElementById('visitorDot');

  let seen = false;
  try { seen = !!localStorage.getItem(KEY); } catch (e) {}

  const img = document.createElement('img');
  img.src = URL;
  img.alt = '';
  img.addEventListener('error', () => {
    img.remove();
    const t = document.createElement('span');
    t.textContent = seen ? '✓' : '–';
    t.style.color = '#ffd23f';
    t.style.font  = '900 13px ui-monospace,monospace';
    slot.appendChild(t);
  });
  slot.appendChild(img);

  if (!seen) {
    try { localStorage.setItem(KEY, String(Date.now())); } catch (e) {}
  } else {
    dot.classList.add('cached');
    label.textContent = 'VISITED';
  }
})();
</script>

<script>
/* ============================================================================
   PICKER HANDLER (plain script — fires immediately on tap)
   The module registers `window.__startGame`. If the module isn't ready yet
   when the user taps, we queue the pick and hide the picker with a hint.
   ========================================================================== */
(function () {
  window.__pendingTeam = null;
  window.__moduleReady = false;

  function choose(team, el) {
    if (el) el.style.pointerEvents = 'none';
    if (window.__moduleReady && window.__startGame) {
      window.__startGame(team);
    } else {
      window.__pendingTeam = team;
      var hint = document.getElementById('cpHint');
      if (hint) hint.textContent = 'LOADING…';
      var btns = document.querySelectorAll('.cp-btn');
      for (var i = 0; i < btns.length; i++) btns[i].style.pointerEvents = 'none';
    }
  }

  document.querySelectorAll('.cp-btn').forEach(function (b) {
    b.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      choose(parseInt(b.dataset.team, 10) || 0, b);
    }, { passive: false });
    b.addEventListener('click', function (e) {
      e.preventDefault();
    });
  });
})();
</script>

function stripGeo(path, offA, yA, offB, yB, N) {
  const pos=[], nor=[], uv=[], idx=[], p={};
  for (let i=0; i<=N; i++) {
    const s = (i/N)*path.length; path.at(s, p);
    const rx=-p.tz, rz=p.tx;
    const ax=p.x+rx*offA, az=p.z+rz*offA;
    const bx=p.x+rx*offB, bz=p.z+rz*offB;
    pos.push(ax,yA,az, bx,yB,bz);
    const dxv=bx-ax, dyv=yB-yA, dzv=bz-az;
    let nx=dyv*p.tz, ny=dzv*p.tx-dxv*p.tz, nz=-dyv*p.tx;
    const nl=Math.hypot(nx,ny,nz)||1;
    nor.push(nx/nl,ny/nl,nz/nl, nx/nl,ny/nl,nz/nl);
    uv.push(0,i/N, 1,i/N);
  }
  for (let i=0;i<N;i++){const a=i*2; idx.push(a,a+1,a+2, a+1,a+3,a+2);}
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',   new THREE.Float32BufferAttribute(nor,3));
  g.setAttribute('uv',       new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx); return g;
}

function buildWorld() {
  const worldParts = [];
  const W = (g, c) => worldParts.push([g, c]);

  /* ground */
  W(xform(new THREE.PlaneGeometry(800, 800).rotateX(-Math.PI/2), 0, -0.08, 0), 0x6f7a4e);

  /* road ring — reduced resolution (was 300) */
  const NSEG = 140;
  W(stripGeo(RING,-ROAD_HALF,0.020, ROAD_HALF,0.020,NSEG), 0x2f3033);
  W(stripGeo(RING, ROAD_HALF,0.020, ROAD_HALF,0.16,NSEG), 0x9a9a92);
  W(stripGeo(RING, ROAD_HALF,0.160, 10.0,0.160,NSEG), 0xa8a89e);
  W(stripGeo(RING,-ROAD_HALF,0.160,-ROAD_HALF,0.020,NSEG), 0x9a9a92);
  W(stripGeo(RING,-10.0,0.160,-ROAD_HALF,0.160,NSEG), 0xa8a89e);

  /* cross street */
  {
    const W2=5.0;
    W(xform(new THREE.PlaneGeometry(W2*2, CROSS_HALF*2).rotateX(-Math.PI/2), 0,0.012,0), 0x2f3033);
    const walk = new THREE.BoxGeometry(3,0.16,CROSS_HALF*2);
    W(xform(walk.clone(), -W2-1.5, 0.08, 0), 0xa8a89e);
    W(xform(walk.clone(),  W2+1.5, 0.08, 0), 0xa8a89e);
  }

  /* centre lines */
  W(stripGeo(RING,-0.22,0.030,-0.10,0.030,NSEG), 0xd9b32a);
  W(stripGeo(RING, 0.10,0.030, 0.22,0.030,NSEG), 0xd9b32a);

  /* dashed lane markings — fewer */
  for (let s = 0; s < L; s += 14) {
    const p = RING.at(s), rx=-p.tz, rz=p.tx, ry=Math.atan2(p.tx,p.tz);
    for (const off of [-3,3])
      W(xform(new THREE.BoxGeometry(0.16,0.02,3.4), p.x+rx*off, 0.030, p.z+rz*off, 0,ry,0), 0xdedbcc);
  }
  for (let z=-CROSS_HALF; z<CROSS_HALF; z+=14)
    W(xform(new THREE.BoxGeometry(0.16,0.02,3.4), 0,0.030,z), 0xdedbcc);

  /* buildings — less dense (step 34 vs 26) */
  {
    const pal = [0x8d8577,0x9a8f7e,0x7d7a73,0xa39684,0x6f6a63,0xb0a48f];
    const inRing  = (x,z)=> Math.abs(x)<76&&Math.abs(z)<58;
    const onCross = (x)=> Math.abs(x)<12;
    for (let gx=-160; gx<=160; gx+=34)
      for (let gz=-140; gz<=140; gz+=34) {
        const x=gx+rr(-5,5), z=gz+rr(-5,5);
        if (inRing(x,z)||onCross(x)) continue;
        if (inPitchZone(x,z,10)||inSchoolZone(x,z,6)) continue;
        if (rnd()<0.25) continue;
        const w=rr(9,19), d=rr(9,19), h=rr(7,30);
        const col = pal[(rnd()*pal.length)|0];
        W(xform(new THREE.BoxGeometry(w,h,d), x,h/2,z, 0,rr(-0.25,0.25),0), col);
        W(xform(new THREE.BoxGeometry(w*1.05,0.7,d*1.05), x,h+0.35,z), 0x5b5750);
        if (rnd()<0.5)
          W(xform(new THREE.BoxGeometry(rr(2.5,4.5),2.2,rr(2.5,4.5)),
                  x+rr(-w*0.25,w*0.25), h+1.5, z+rr(-d*0.25,d*0.25)), 0x8a6b4a);
      }
  }

  /* palms — fewer (25 vs 60) */
  for (let i = 0; i < 25; i++) {
    const s=rnd()*L, side=rnd()<0.5?1:-1;
    const p=RING.at(s), rx=-p.tz, rz=p.tx;
    const d=side*rr(12,20);
    const x=p.x+rx*d, z=p.z+rz*d;
    if (inPitchZone(x,z,4)||inSchoolZone(x,z,3)) continue;
    const h=rr(5,9);
    W(xform(new THREE.CylinderGeometry(0.20,0.32,h,5), x,h/2,z), 0x6b5340);
    for (let f=0; f<4; f++) {
      const a=(f/4)*TAU+rnd();
      W(xform(new THREE.ConeGeometry(0.55,3.2,3),
              x+Math.cos(a)*0.9, h+0.5, z+Math.sin(a)*0.9,
              Math.cos(a)*1.15, 0, -Math.sin(a)*1.15), 0x3f7d3a);
    }
  }

  /* pitch, goals, school */
  {
    const B = PB;
    const NSTRIPE = 8, sw = PITCH.w / NSTRIPE;
    for (let i=0; i<NSTRIPE; i++) {
      const col = (i%2===0) ? 0x3f8a3a : 0x357a32;
      W(xform(new THREE.BoxGeometry(sw, 0.12, PITCH.h),
              B.minX + sw*(i+0.5), -0.04, PITCH.cz), col);
    }
    const LW=0.12, LY=0.027;
    W(xform(new THREE.BoxGeometry(PITCH.w,0.012,LW), PITCH.cx,LY,B.minZ), 0xffffff);
    W(xform(new THREE.BoxGeometry(PITCH.w,0.012,LW), PITCH.cx,LY,B.maxZ), 0xffffff);
    W(xform(new THREE.BoxGeometry(LW,0.012,PITCH.h), B.minX,LY,PITCH.cz), 0xffffff);
    W(xform(new THREE.BoxGeometry(LW,0.012,PITCH.h), B.maxX,LY,PITCH.cz), 0xffffff);
    W(xform(new THREE.BoxGeometry(LW,0.012,PITCH.h), PITCH.cx,LY,PITCH.cz), 0xffffff);
    W(xform(new THREE.TorusGeometry(3.0,LW*0.55,4,20), PITCH.cx,LY,PITCH.cz, -Math.PI/2,0,0), 0xffffff);
    W(xform(new THREE.CylinderGeometry(0.13,0.13,0.014,6), PITCH.cx,LY,PITCH.cz), 0xffffff);

    const FH=0.85, PR=0.045, SP2=2.5;
    const gz0 = PITCH.cz - GOAL_W/2 - 0.35;
    const gz1 = PITCH.cz + GOAL_W/2 + 0.35;
    const fenceSeg = (x0,z0,x1,z1) => {
      const dx=x1-x0, dz=z1-z0, len=Math.hypot(dx,dz);
      if (len<0.01) return;
      const n = Math.max(1, Math.round(len/SP2));
      for (let i=0;i<=n;i++) {
        const t=i/n;
        W(xform(new THREE.CylinderGeometry(PR,PR,FH,5),
                x0+dx*t, FH/2, z0+dz*t), 0x9a9a92);
      }
      const ry = Math.atan2(dx,dz);
      for (const yy of [0.32, 0.74])
        W(xform(new THREE.BoxGeometry(0.05,0.05,len),
                (x0+x1)/2, yy, (z0+z1)/2, 0,ry,0), 0x9a9a92);
    };
    fenceSeg(B.minX,B.minZ, B.minX,gz0);
    fenceSeg(B.minX,gz1,   B.minX,B.maxZ);
    fenceSeg(B.maxX,B.minZ, B.maxX,gz0);
    fenceSeg(B.maxX,gz1,   B.maxX,B.maxZ);
    fenceSeg(B.minX,B.minZ, B.maxX,B.minZ);
    fenceSeg(B.minX,B.maxZ, B.maxX,B.maxZ);

    const addGoal = (gx, colr) => {
      const pr=0.07;
      W(xform(new THREE.CylinderGeometry(pr,pr,GOAL_H,6), gx, GOAL_H/2, PITCH.cz-GOAL_W/2), colr);
      W(xform(new THREE.CylinderGeometry(pr,pr,GOAL_H,6), gx, GOAL_H/2, PITCH.cz+GOAL_W/2), colr);
      W(xform(new THREE.CylinderGeometry(pr,pr,GOAL_W+pr*2,6), gx, GOAL_H, PITCH.cz, 0,0,Math.PI/2), colr);
    };
    addGoal(B.minX, 0xd8483a);
    addGoal(B.maxX, 0x75AADB);

    const s = SCHOOL;
    W(xform(new THREE.BoxGeometry(s.w,s.h,s.d), s.x, s.h/2, s.z), 0xe6d9bd);
    W(xform(new THREE.BoxGeometry(s.w+0.8,0.45,s.d+0.8), s.x, s.h+0.22, s.z), 0x8a4a3a);
    for (let i=0;i<5;i++) {
      const wx = s.x-s.w/2+2.5+i*3.5;
      W(xform(new THREE.BoxGeometry(1.35,1.55,0.10), wx, 3.4, s.z+s.d/2+0.05), 0x3a5a7a);
    }
    W(xform(new THREE.BoxGeometry(1.7,2.7,0.12), s.x-6.2, 1.35, s.z+s.d/2+0.06), 0x5a3a2a);
  }

  /* merge to one big mesh */
  const geo = P(worldParts);
  worldMesh = new THREE.Mesh(geo, MAT.world);
  worldMesh.frustumCulled = false;
  scene.add(worldMesh);
  worldParts.length = 0;

  /* nets (LineSegments) */
  const makeNet = (gx) => {
    const backX = gx===PB.minX ? gx-GOAL_DEPTH : gx+GOAL_DEPTH;
    const z0 = PITCH.cz-GOAL_W/2, z1 = PITCH.cz+GOAL_W/2;
    const pos=[], NZ=6, NY=3;
    for (let i=0;i<=NZ;i++){const z=z0+(z1-z0)*i/NZ; pos.push(backX,0,z, backX,GOAL_H,z);}
    for (let j=0;j<=NY;j++){const y=GOAL_H*j/NY; pos.push(backX,y,z0, backX,y,z1);}
    for (const zz of [z0,z1]) for (let j=0;j<=NY;j++) {
      const y = GOAL_H*j/NY; pos.push(gx,y,zz, backX,y,zz);
    }
    for (let i=0;i<=NZ;i++){const z=z0+(z1-z0)*i/NZ; pos.push(gx,GOAL_H,z, backX,GOAL_H,z);}
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
    return new THREE.LineSegments(g, new THREE.LineBasicMaterial({
      color:0xd8d8d8, transparent:true, opacity:0.6 }));
  };
  scene.add(makeNet(PB.minX));
  scene.add(makeNet(PB.maxX));
}

const LAMP_GEO = new THREE.CircleGeometry(0.17, 10);
function makeTrafficLight() {
  const g = new THREE.Group();
  const housing = P([
    [xform(new THREE.CylinderGeometry(0.09,0.13,5.6,6),0,2.8,0), 0x2b2f33],
    [xform(new THREE.BoxGeometry(0.34,0.24,0.34),0,0.12,0), 0x3a3f44],
    [xform(new THREE.BoxGeometry(0.46,1.55,0.36),0,5.92,0), 0x1b1e20]
  ]);
  g.add(new THREE.Mesh(housing, MAT.world));
  const mk = (y)=>{const m=new THREE.Mesh(LAMP_GEO, MAT.lampRedOff); m.position.set(0,y,0.19); g.add(m); return m;};
  return { group:g, red:mk(6.44), yel:mk(5.92), grn:mk(5.40) };
}
const TL_LAYOUT = [
  {x: 8.5,z: 51,ry:-Math.PI/2},{x:-8.5,z: 33,ry: Math.PI/2},
  {x:-8.5,z: 51,ry: Math.PI},  {x: 8.5,z: 33,ry: 0},
  {x:-8.5,z:-51,ry: Math.PI/2},{x: 8.5,z:-33,ry:-Math.PI/2},
  {x: 8.5,z:-51,ry: Math.PI},  {x:-8.5,z:-33,ry: 0}
];
function buildTrafficLights() {
  for (const cfg of TL_LAYOUT) {
    const tl = makeTrafficLight();
    tl.group.position.set(cfg.x, 0, cfg.z);
    tl.group.rotation.y = cfg.ry;
    scene.add(tl.group);
    trafficLights.push(tl);
  }
}
const CYCLE = 28;
function lightState(t) {
  const u = t % CYCLE;
  if (u < 11) return 0; if (u < 13) return 1; if (u < 14) return 2;
  if (u < 25) return 3; if (u < 27) return 4; return 2;
}
const ringStopOf  = (st)=> st >= 2;
const crossStopOf = (st)=> st <= 2;
function paintLights(st) {
  const rg=st===0, ry=st===1, cg=st===3, cy=st===4;
  for (let i=0;i<trafficLights.length;i++) {
    const tl = trafficLights[i];
    const isRing = (i===0||i===1||i===4||i===5);
    const g = isRing ? rg : cg, y = isRing ? ry : cy;
    tl.grn.material = g ? MAT.lampGrnOn : MAT.lampGrnOff;
    tl.yel.material = y ? MAT.lampYelOn : MAT.lampYelOff;
    tl.red.material = (!g && !y) ? MAT.lampRedOn : MAT.lampRedOff;
  }
}

function wheelGeo(r, w) {
  const key = r+'|'+w;
  let g = wheelCache.get(key);
  if (g) return g;
  const list = [
    [CY(r,r,w,10,0,0,0,0,0,Math.PI/2), 0x1b1b1b],
    [CY(r*0.46,r*0.46,w*1.02,8,0,0,0,0,0,Math.PI/2), 0xb9b9b9]
  ];
  for (let i=0;i<3;i++) list.push([BX(w*1.30, r*1.55, 0.07, 0,0,0, i*Math.PI/3,0,0), 0xdcdcdc]);
  g = P(list); wheelCache.set(key, g); return g;
}
function buildGroup(spec) {
  const g = new THREE.Group();
  for (const key in spec) {
    if (!spec[key].length) continue;
    g.add(new THREE.Mesh(P(spec[key]), MAT[key==='glass'?'glass':'vehicle']));
  }
  return g;
}

class RingVehicle {

    const T = TYPES[type];
    this.type=type; this.lane=lane; this.dir=lane.dir; this.off=lane.off;
    this.p=p; this.spd=T.v0*0.55; this.v0=T.v0; this.aMax=T.aMax;
    this.len=T.len; this.acc=0; this.wheelR=T.wheelR;
    this.weavePhase=rnd()*TAU; this.lean=0;
    this.obj = TEMPLATES[type].clone(true);
    this.wheels = [];
    const wg = wheelGeo(T.wheelR, T.wheelW);
    for (const [wx,wy,wz] of T.wheels) {
      const w = new THREE.Mesh(wg, MAT.tire);
      w.position.set(wx,wy,wz); this.obj.add(w); this.wheels.push(w);
    }
    const sh = new THREE.Mesh(SHADOW_GEO, MAT.shadow);
    sh.scale.set(T.shadow[0],1,T.shadow[1]); sh.position.y=0.045;
    this.obj.add(sh);
    scene.add(this.obj);
  }
  get s() { return this.dir>0 ? mod(this.p,L) : mod(-this.p,L); }
}
class CrossVehicle {

function buildVehicles() {
  TEMPLATES.danfo = buildGroup(DANFO_SPEC);
  TEMPLATES.keke  = buildGroup(KEKE_SPEC);
  TEMPLATES.okada = buildGroup(OKADA_SPEC);

  const mix = ['danfo','danfo','keke','okada'];
  /* 3 per lane (was 4) → 12 ring vehicles */
  for (const lane of LANES) {
    const n = 3, spacing = L/n;
    for (let i=0;i<n;i++) {
      const type = mix[(rnd()*mix.length)|0];
      const p0 = i*spacing + rr(-0.22,0.22)*spacing;
      const P0 = lane.dir>0 ? mod(p0,L) : mod(-p0,L);
      lane.veh.push(new RingVehicle(type, lane, P0));
    }
  }
  /* 2 per cross-lane (was 3) → 4 cross vehicles */
  for (const lane of CROSS_LANES)
    for (let i=0;i<2;i++) {
      const type = rnd()<0.5 ? 'danfo' : 'keke';
      lane.veh.push(new CrossVehicle(type, lane, i*(CROSS_LEN/2)+rr(-14,14)));
    }
}

/* ============================================================================
   10.  TRAFFIC SIM  (IDM)
   ========================================================================== */
function idm(v, gap, dv) {
  const s0=2.0, T=1.15, b=2.4, a=v.aMax;
  if (gap < 0.10) gap = 0.10;
  const sStar = s0 + Math.max(0, v.spd*T + (v.spd*dv)/(2*Math.sqrt(a*b)));
  const free  = 1 - Math.pow(Math.min(v.spd/v.v0, 2.5), 4);
  return a * (free - (sStar*sStar)/(gap*gap));
}
const _p = {};
function updateRingTraffic(dt, t, st) {
  const stop = ringStopOf(st);
  for (const lane of LANES) {
    const vs = lane.veh, n = vs.length; if (!n) continue;
    vs.sort((a,b)=>a.p-b.p);
    const stopP = lane.dir>0 ? [mod(STOP_RING[0],L), mod(STOP_RING[1],L)]
                             : [mod(-STOP_RING[0],L), mod(-STOP_RING[1],L)];
    for (let i=0;i<n;i++) {
      const v = vs[i];
      let a = v.aMax*(1 - Math.pow(Math.min(v.spd/v.v0,2.5),4));
      const lead = vs[(i+1)%n];
      const leadP = (i+1<n) ? lead.p : lead.p+L;
      const gap = leadP - v.p - (v.len+lead.len)*0.5;
      a = Math.min(a, idm(v, gap, v.spd-lead.spd));
      if (stop) for (let k=0;k<2;k++) {
        const d = mod(stopP[k]-v.p, L);
        if (d < 65) a = Math.min(a, idm(v, d - v.len*0.5, v.spd));
      }
      v.acc = clamp(a, -7.5, v.aMax);
    }
    for (const v of vs) {
      v.spd = Math.max(0, v.spd + v.acc*dt);
      if (v.spd > v.v0*1.30) v.spd = v.v0*1.30;
      v.p += v.spd*dt;
    }
  }
}
function updateCrossTraffic(dt, t, st) {
  const stop = crossStopOf(st);
  for (const lane of CROSS_LANES) {
    const vs = lane.veh, n = vs.length; if (!n) continue;
    vs.sort((a,b)=>a.p-b.p);
    for (let i=0;i<n;i++) {
      const v = vs[i];
      let a = v.aMax*(1 - Math.pow(Math.min(v.spd/v.v0,2.5),4));
      const lead = vs[(i+1)%n];
      const leadP = (i+1<n) ? lead.p : lead.p+CROSS_LEN;
      const gap = leadP - v.p - (v.len+lead.len)*0.5;
      a = Math.min(a, idm(v, gap, v.spd-lead.spd));
      if (stop) for (let k=0;k<2;k++) {
        const d = mod(CROSS_STOP[k]-v.p, CROSS_LEN);
        if (d < 70) a = Math.min(a, idm(v, d - v.len*0.5, v.spd));
      }
      v.acc = clamp(a, -7.5, v.aMax);
    }
    for (const v of vs) {
      v.spd = Math.max(0, v.spd + v.acc*dt);
      if (v.spd > v.v0*1.30) v.spd = v.v0*1.30;
      v.p += v.spd*dt;
    }
  }
}
function placeRingVehicle(v, dt, t) {
  const s = v.s; RING.at(s, _p);
  const rx = -_p.tz, rz = _p.tx;
  let off = v.off;
  if (v.type === 'okada') off += Math.sin(t*1.9 + v.weavePhase)*0.75;
  v.obj.position.set(_p.x + rx*off, 0, _p.z + rz*off);
  const fx = _p.tx*v.dir, fz = _p.tz*v.dir;
  const yaw = Math.atan2(fx, fz);
  let lean = 0;
  if (v.type === 'okada') {
    const tg = Math.atan((v.spd*v.spd*_p.k)/(9.81*1.55));
    lean = lerp(v.lean, tg, 1 - Math.exp(-dt*4)); v.lean = lean;
  } else if (v.type === 'keke') {
    const tg = Math.atan((v.spd*v.spd*_p.k)/(9.81*4.5));
    lean = lerp(v.lean, tg, 1 - Math.exp(-dt*3)); v.lean = lean;
  }
  v.obj.rotation.set(0, yaw, lean);
  const spin = (v.spd*dt)/v.wheelR;
  for (const w of v.wheels) w.rotation.x -= spin;
}
function placeCrossVehicle(v, dt) {
  const u = mod(v.p, CROSS_LEN);
  const z = v.dir>0 ? (-CROSS_HALF+u) : (CROSS_HALF-u);
  v.obj.position.set(v.lane.x, 0, z);
  v.obj.rotation.set(0, v.dir>0 ? 0 : Math.PI, 0);
  const spin = (v.spd*dt)/v.wheelR;
  for (const w of v.wheels) w.rotation.x -= spin;
}

let audioCtx = null, noiseBuf = null;
function ensureAudio() {
  if (audioCtx) { if (audioCtx.state === 'suspended') audioCtx.resume(); return; }
  try {
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const len = Math.floor(audioCtx.sampleRate * 1.2);
    noiseBuf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i=0; i<len; i++) d[i] = Math.random()*2-1;
  } catch(e){ audioCtx = null; }
}
function playKick(power) {
  if (!audioCtx || !noiseBuf) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  osc.type='sine';
  osc.frequency.setValueAtTime(190, t);
  osc.frequency.exponentialRampToValueAtTime(52, t+0.10);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.42*power, t+0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t+0.16);
  osc.connect(g).connect(audioCtx.destination);
  osc.start(t); osc.stop(t+0.18);
  const src = audioCtx.createBufferSource();
  src.buffer = noiseBuf;
  const bp = audioCtx.createBiquadFilter();
  bp.type='bandpass'; bp.frequency.value=1900; bp.Q.value=0.9;
  const ng = audioCtx.createGain();
  ng.gain.setValueAtTime(0.28*power, t);
  ng.gain.exponentialRampToValueAtTime(0.0001, t+0.07);
  src.connect(bp).connect(ng).connect(audioCtx.destination);
  src.start(t, 0, 0.09);
}
function playBounce(vol) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  osc.type='sine';
  osc.frequency.setValueAtTime(130, t);
  osc.frequency.exponentialRampToValueAtTime(58, t+0.07);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.20*vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+0.10);
  osc.connect(g).connect(audioCtx.destination);
  osc.start(t); osc.stop(t+0.12);
}
function playPost() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  osc.type='triangle';
  osc.frequency.setValueAtTime(920, t);
  osc.frequency.exponentialRampToValueAtTime(430, t+0.32);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.24, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+0.42);
  osc.connect(g).connect(audioCtx.destination);
  osc.start(t); osc.stop(t+0.45);
}
function playCheer() {
  if (!audioCtx || !noiseBuf) return;
  const t = audioCtx.currentTime, dur = 2.1;
  const src = audioCtx.createBufferSource();
  src.buffer = noiseBuf; src.loop = true;
  const bp = audioCtx.createBiquadFilter();
  bp.type='bandpass';
  bp.frequency.setValueAtTime(620, t);
  bp.frequency.linearRampToValueAtTime(1900, t+0.34);
  bp.frequency.linearRampToValueAtTime(880, t+dur);
  bp.Q.value = 1.1;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.60, t+0.10);
  g.gain.linearRampToValueAtTime(0.42, t+0.55);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  src.connect(bp).connect(g).connect(audioCtx.destination);
  src.start(t); src.stop(t+dur+0.05);
  for (let i=0; i<3; i++) {
    const o = audioCtx.createOscillator();
    o.type='sawtooth';
    const bf = 290 + i*95;
    const tt = t + i*0.055;
    o.frequency.setValueAtTime(bf, tt);
    o.frequency.linearRampToValueAtTime(bf*1.42, tt+0.30);
    o.frequency.linearRampToValueAtTime(bf*0.88, tt+1.05);
    const og = audioCtx.createGain();
    og.gain.setValueAtTime(0.0001, t);
    og.gain.linearRampToValueAtTime(0.045, tt+0.16);
    og.gain.exponentialRampToValueAtTime(0.0001, t+1.35);
    const lp = audioCtx.createBiquadFilter();
    lp.type='lowpass'; lp.frequency.value = 1650;
    o.connect(lp).connect(og).connect(audioCtx.destination);
    o.start(t); o.stop(t+1.45);
  }
}

function roundRectPath(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.lineTo(x + w - r, y);
  g.quadraticCurveTo(x + w, y, x + w, y + r);
  g.lineTo(x + w, y + h - r);
  g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  g.lineTo(x + r, y + h);
  g.quadraticCurveTo(x, y + h, x, y + h - r);
  g.lineTo(x, y + r);
  g.quadraticCurveTo(x, y, x + r, y);
  g.closePath();
}

  hip.position.y = HIP_Y;
  root.add(hip);

  const addPart = (geo, col, parent) => {
    const m = new THREE.Mesh(paint(geo.clone(), col), MAT.vehicle);
    (parent || hip).add(m);
    return m;
  };

  if (opts.stripeTex) {
    const torsoMat = new THREE.MeshLambertMaterial({
      map: opts.stripeTex, color: 0xffffff
    });
    hip.add(new THREE.Mesh(GEO.torso.clone(), torsoMat));
  } else {
    addPart(GEO.torso, shirtC);
  }
  addPart(GEO.neck, skinC);

  const head = new THREE.Group();
  head.position.y = BODY_H + 0.24;
  hip.add(head);
  head.add(new THREE.Mesh(paint(GEO.head.clone(), skinC), MAT.vehicle));
  head.add(new THREE.Mesh(paint(GEO.hair.clone(), hairC), MAT.vehicle));

  const eyeL = new THREE.Mesh(GEO.eye, FACE_MAT);
  eyeL.position.set( 0.048, 0.028, 0.116);
  head.add(eyeL);
  const eyeR = new THREE.Mesh(GEO.eye, FACE_MAT);
  eyeR.position.set(-0.048, 0.028, 0.116);
  head.add(eyeR);

  const mouthNeutral = new THREE.Mesh(GEO.mouth, FACE_MAT);
  mouthNeutral.position.set(0, -0.056, 0.122);
  head.add(mouthNeutral);

  const mouthSmile = new THREE.Mesh(GEO.smile, FACE_MAT);
  mouthSmile.position.set(0, -0.040, 0.120);
  mouthSmile.visible = false;
  head.add(mouthSmile);

  if (opts.number) {
    const tex = makeNumberTexture(opts.number, opts.numberFg || '#ffffff');
    const mat = new THREE.MeshBasicMaterial({
      map: tex, transparent: true, depthWrite: false,
      polygonOffset: true, polygonOffsetFactor: -2
    });
    const nm = new THREE.Mesh(new THREE.PlaneGeometry(0.22, 0.22), mat);
    nm.position.set(0, BODY_H * 0.62, -0.106);
    nm.rotation.y = Math.PI;
    hip.add(nm);
  }
  if (opts.logo) {
    const mat = new THREE.MeshBasicMaterial({
      map: EPH_LOGO_TEX, transparent: true, depthWrite: false,
      polygonOffset: true, polygonOffsetFactor: -2
    });
    const lm = new THREE.Mesh(new THREE.PlaneGeometry(0.085, 0.085), mat);
    lm.position.set(-0.075, BODY_H * 0.72, 0.106);
    hip.add(lm);
  }

  const emote = new THREE.Sprite(EMOTE_MAT);
  emote.scale.set(1.00, 0.625, 1);
  emote.position.set(0, 2.05, 0);
  emote.visible = false;
  root.add(emote);

  const buildArm = (side) => {
    const sh = new THREE.Group();
    sh.position.set(side * SHOULDER_X, SHOULDER_Y, 0);
    hip.add(sh);
    addPart(GEO.uarm, shirtC, sh);
    const el = new THREE.Group();
    el.position.y = -UPPER_ARM;
    sh.add(el);
    addPart(GEO.farm, skinC, el);
    addPart(GEO.hand, skinC, el);
    return { shoulder: sh, elbow: el };
  };
  const armL = buildArm( 1);
  const armR = buildArm(-1);

  const buildLeg = (side) => {
    const hp = new THREE.Group();
    hp.position.set(side * HIP_X, 0, 0);
    hip.add(hp);
    addPart(GEO.thigh, pantsC, hp);
    const kn = new THREE.Group();
    kn.position.y = -THIGH_LEN;
    hp.add(kn);
    addPart(GEO.shin, pantsC, kn);
    const an = new THREE.Group();
    an.position.y = -SHIN_LEN;
    kn.add(an);
    addPart(GEO.foot, 0x2a2a2a, an);
    return { hip: hp, knee: kn, ankle: an };
  };
  const legL = buildLeg( 1);
  const legR = buildLeg(-1);

  const shadow = new THREE.Mesh(SHADOW_GEO, MAT.shadow);
  shadow.scale.set(0.42, 1, 0.42);
  shadow.position.y = 0.02;
  root.add(shadow);

  return {
    root, hip, armL, armR, legL, legR, shadow, head,
    face: { eyeL, eyeR, mouthNeutral, mouthSmile, emote }
  };
}

function setExpression(rig, mode) {
  const f = rig.face;
  if (!f) return;
  if (mode === 'suu') {
    f.mouthNeutral.visible = false;
    f.mouthSmile.visible   = true;
    f.eyeL.scale.set(1.15, 0.42, 1);
    f.eyeR.scale.set(1.15, 0.42, 1);
    f.emote.visible = true;
  } else {
    f.mouthNeutral.visible = true;
    f.mouthSmile.visible   = false;
    f.eyeL.scale.set(1, 1, 1);
    f.eyeR.scale.set(1, 1, 1);
    f.emote.visible = false;
  }
}

/* ============================================================================
   15.  POSE + CONTROLLER
   ========================================================================== */
function legCycle(p, s01, strideAmp, kneeAmp, footAmp) {
  const swing = Math.sin(p);
  const lift  = Math.max(0, Math.sin(p + Math.PI * 0.72));
  const hipA  = swing * strideAmp * s01;
  const kneeA = lift * kneeAmp * s01 + 0.06;
  const footA = -(hipA + kneeA) * 0.88 + Math.sin(p * 2) * footAmp * s01;
  return { hip: hipA, knee: kneeA, foot: footA };
}
function armCycle(p, s01) {
  const swing = Math.sin(p);
  return {
    shoulder: swing * 0.52 * s01,
    elbow: 0.18 + Math.max(0, swing) * 0.62 * s01 + 0.10 * s01
  };
}

function computePose(c) {
  const s01   = clamp(c.speed / c.runSpeed, 0, 1);
  const phase = c.cyclePhase;
  const P = {
    hipY: HIP_Y, lean: 0,
    legL: { hip: 0, knee: 0.05, foot: 0 },
    legR: { hip: 0, knee: 0.05, foot: 0 },
    armL: { shoulder: 0, elbow: 0.20 },
    armR: { shoulder: 0, elbow: 0.20 }
  };

  if (c.celebrateTimer > 0) {
    const k = clamp(c.celebrateTimer / c.celebrateDuration, 0, 1);
    const t = c.t;
    const env = Math.min(1, k * 2.4);
    const bounce = Math.abs(Math.sin(t * 9.5)) * 0.17 * env;
    const wave   = Math.sin(t * 11.0) * 0.30 * env;
    P.hipY = HIP_Y + bounce;
    P.lean = -0.13 * env;
    P.armL.shoulder = (2.62 + wave) * env;
    P.armR.shoulder = (2.62 - wave) * env;
    P.armL.elbow = 0.55 * env;
    P.armR.elbow = 0.55 * env;
    P.legL.hip  = -0.10 * env;
    P.legR.hip  = -0.10 * env;
    P.legL.knee = (0.22 + bounce * 2.2) * env;
    P.legR.knee = (0.22 + bounce * 2.2) * env;
    P.legL.foot = -0.12 * env;
    P.legR.foot = -0.12 * env;
    return P;
  }

  if (c.onGround) {
    if (s01 < 0.02) {
      const b = Math.sin(c.t * 1.6) * 0.012;
      P.hipY = HIP_Y + b;
      P.legL.knee = 0.06 + b * 0.4;
      P.legR.knee = 0.06 + b * 0.4;
      P.armL.elbow = 0.22 + b * 0.8;
      P.armR.elbow = 0.22 + b * 0.8;
    } else {
      const pL = phase, pR = phase + Math.PI;
      P.lean = 0.06 + s01 * 0.30;
      P.hipY = HIP_Y + Math.cos(phase * 2) * (0.025 + s01 * 0.045);
      P.legL = legCycle(pL, s01, 0.55 + s01*0.30, 1.05 + s01*0.55, 0.20 + s01*0.35);
      P.legR = legCycle(pR, s01, 0.55 + s01*0.30, 1.05 + s01*0.55, 0.20 + s01*0.35);
      P.armL = armCycle(pR, s01);
      P.armR = armCycle(pL, s01);
    }
  } else {
    const upT = clamp(c.vel.y / 5.0, -1, 1);
    if (upT > 0) {
      const k = smoothstep(upT);
      P.legL.hip = -lerp(0.10, 0.55, k);
      P.legR.hip = -lerp(0.00, 0.30, k);
      P.legL.knee =  lerp(0.30, 1.30, k);
      P.legR.knee =  lerp(0.20, 0.90, k);
      P.armL.shoulder = -lerp(0.30, 1.35, k);
      P.armR.shoulder = -lerp(0.30, 1.35, k);
      P.armL.elbow = 0.35; P.armR.elbow = 0.35;
      P.hipY = HIP_Y + 0.02 * k;
      P.lean = 0.12 * k;
    } else {
      const k = smoothstep(-upT);
      P.legL.hip = -lerp(0.15, 0.35, k);
      P.legR.hip = -lerp(0.05, 0.15, k);
      P.legL.knee =  lerp(0.30, 0.70, k);
      P.legR.knee =  lerp(0.30, 0.55, k);
      P.armL.shoulder = lerp(-0.30, 0.20, k);
      P.armR.shoulder = lerp(-0.30, 0.20, k);
      P.armL.elbow = 0.30; P.armR.elbow = 0.30;
      P.lean = 0.05;
    }
  }

  if (c.landTimer > 0) {
    const k = c.landTimer / c.landDuration;
    const e = k * k;
    P.hipY   -= 0.16 * e;
    P.legL.knee += 0.85 * e;  P.legR.knee += 0.85 * e;
    P.legL.hip  -= 0.30 * e;  P.legR.hip  -= 0.30 * e;
    P.legL.foot += 0.35 * e;  P.legR.foot += 0.35 * e;
    P.armL.shoulder -= 0.35 * e; P.armR.shoulder -= 0.35 * e;
    P.lean += 0.18 * e;
  }

  if (c.kickTimer > 0) {
    const k = c.kickTimer / c.kickDuration;
    const t = 1 - k;
    let swing;
    if (t < 0.32)      swing = -smoothstep(t / 0.32) * 0.55;
    else if (t < 0.55) swing = lerp(-0.55, 1.35, smoothstep((t - 0.32) / 0.23));
    else               swing = lerp(1.35, 0.25, smoothstep((t - 0.55) / 0.45));
    P.legR.hip  = swing;
    P.legR.knee = Math.max(0.05, 0.55 - swing * 0.35);
    P.legR.foot = -(P.legR.hip + P.legR.knee) * 0.7 - 0.15;
    P.armL.shoulder = -swing * 0.55;
    P.armR.shoulder =  swing * 0.40;
    P.lean += swing * 0.10;
  }
  return P;
}

function applyPose(rig, pose) {
  rig.hip.position.y = pose.hipY;
  rig.hip.rotation.x = -pose.lean;
  rig.legL.hip.rotation.x   = -pose.legL.hip;
  rig.legL.knee.rotation.x  =  pose.legL.knee;
  rig.legL.ankle.rotation.x =  pose.legL.foot;
  rig.legR.hip.rotation.x   = -pose.legR.hip;
  rig.legR.knee.rotation.x  =  pose.legR.knee;
  rig.legR.ankle.rotation.x =  pose.legR.foot;
  rig.armL.shoulder.rotation.x = -pose.armL.shoulder;
  rig.armL.elbow.rotation.x    =  pose.armL.elbow;
  rig.armR.shoulder.rotation.x = -pose.armR.shoulder;
  rig.armR.elbow.rotation.x    =  pose.armR.elbow;
}

const GRAVITY     = 22.0;
const JUMP_VEL    = 7.2;
const WALK_SPEED  = 2.6;
const RUN_SPEED   = 5.8;
const ACCEL       = 16.0;
const DECEL       = 22.0;
const AIR_ACCEL   = 4.5;
const COYOTE      = 0.11;
const JUMP_BUFFER = 0.14;
const JUMP_CUT    = 0.42;
const FIELD_INSET = 0.35;

class Character {
  constructor(rig, x, z, yaw, team) {
    this.rig = rig; this.team = team;
    this.pos = new THREE.Vector3(x, 0, z);
    this.vel = new THREE.Vector3();
    this.yaw = yaw; this.targetYaw = yaw;
    this.onGround = true;
    this.speed = 0; this.runSpeed = RUN_SPEED;
    this.cyclePhase = 0; this.t = 0;
    this.kickTimer = 0; this.kickDuration = 0.42;
    this.landTimer = 0; this.landDuration = 0.24;
    this.celebrateTimer = 0; this.celebrateDuration = 2.4;
    this.coyote = 0; this.jumpBuffer = 0; this.jumpHeld = false;
  }
  kick() { this.kickTimer = this.kickDuration; }
  jump() { this.jumpBuffer = JUMP_BUFFER; }
  releaseJump() { this.jumpHeld = false; }
  celebrate() {
    this.celebrateTimer = this.celebrateDuration;
    this.kickTimer = 0; this.landTimer = 0;
    this.vel.set(0, 0, 0);
    setExpression(this.rig, 'suu');
  }
  update(dt, wishX, wishZ, wantJump, jumpHeld) {
    this.t += dt;
    if (this.kickTimer > 0) this.kickTimer -= dt;
    if (this.landTimer > 0) this.landTimer -= dt;

    if (this.celebrateTimer > 0) {
      this.celebrateTimer -= dt;
      wishX = 0; wishZ = 0; wantJump = false;
      this.vel.x = damp(this.vel.x, 0, 12, dt);
      this.vel.z = damp(this.vel.z, 0, 12, dt);
      if (this.celebrateTimer <= 0) setExpression(this.rig, 'neutral');
    }

    if (wantJump) this.jumpBuffer = JUMP_BUFFER;
    if (this.jumpBuffer > 0) this.jumpBuffer -= dt;
    this.jumpHeld = jumpHeld;

    if (this.onGround) this.coyote = COYOTE;
    else if (this.coyote > 0) this.coyote -= dt;

    if (this.jumpBuffer > 0 && (this.onGround || this.coyote > 0) && this.celebrateTimer <= 0) {
      this.vel.y = JUMP_VEL;
      this.onGround = false;
      this.coyote = 0; this.jumpBuffer = 0; this.landTimer = 0;
    }

    const inputMag = Math.hypot(wishX, wishZ);
    const hasInput = inputMag > 0.02;
    let dx = 0, dz = 0;
    if (hasInput) { dx = wishX / inputMag; dz = wishZ / inputMag; }
    const targetSpeed = hasInput ? (WALK_SPEED + (RUN_SPEED - WALK_SPEED) * clamp(inputMag, 0, 1)) : 0;
    const accelRate = this.onGround ? (hasInput ? ACCEL : DECEL) : AIR_ACCEL;
    this.vel.x = damp(this.vel.x, dx * targetSpeed, accelRate, dt);
    this.vel.z = damp(this.vel.z, dz * targetSpeed, accelRate, dt);

    if (!this.onGround) {
      this.vel.y -= GRAVITY * dt;
      if (this.vel.y > 0 && !jumpHeld && this.jumpBuffer <= 0) {
        this.vel.y *= Math.pow(JUMP_CUT, dt * 60);
      }
    }

    this.pos.x += this.vel.x * dt;
    this.pos.z += this.vel.z * dt;
    this.pos.y += this.vel.y * dt;

    if (this.pos.y <= 0) {
      this.pos.y = 0;
      if (!this.onGround) {
        const impact = Math.abs(this.vel.y);
        if (impact > 3.5) this.landTimer = this.landDuration;
        this.onGround = true;
      }
      this.vel.y = 0;
    } else this.onGround = false;

    if (hasInput && this.onGround && this.celebrateTimer <= 0) {
      this.targetYaw = Math.atan2(dx, dz);
    }
    const dYaw = shortestAngle(this.yaw, this.targetYaw);
    this.yaw += dYaw * Math.min(1, dt * 13);

    const horizSpeed = Math.hypot(this.vel.x, this.vel.z);
    this.speed = horizSpeed;
    if (this.onGround && this.celebrateTimer <= 0) {
      const strideLen = 1.9 + (horizSpeed / RUN_SPEED) * 0.7;
      this.cyclePhase = mod(this.cyclePhase + (horizSpeed / strideLen) * TAU * dt, TAU);
    }

    const bx0 = PB.minX + FIELD_INSET, bx1 = PB.maxX - FIELD_INSET;
    const bz0 = PB.minZ + FIELD_INSET, bz1 = PB.maxZ - FIELD_INSET;
    if (this.pos.x < bx0) { this.pos.x = bx0; this.vel.x = Math.max(0, this.vel.x); }
    if (this.pos.x > bx1) { this.pos.x = bx1; this.vel.x = Math.min(0, this.vel.x); }
    if (this.pos.z < bz0) { this.pos.z = bz0; this.vel.z = Math.max(0, this.vel.z); }
    if (this.pos.z > bz1) { this.pos.z = bz1; this.vel.z = Math.min(0, this.vel.z); }

    this.rig.root.position.copy(this.pos);
    this.rig.root.rotation.y = this.yaw;
    applyPose(this.rig, computePose(this));

    if (this.celebrateTimer > 0) {
      const e = this.rig.face.emote;
      const s = 1 + Math.sin(this.t * 12) * 0.10;
      e.scale.set(1.00 * s, 0.625 * s, 1);
    }

    const h = this.pos.y;
    const sc = clamp(1 - h * 0.22, 0.35, 1);
    this.rig.shadow.scale.set(0.42 * sc, 1, 0.42 * sc);
    this.rig.shadow.position.y = 0.02 - this.pos.y + h;
  }
}

/* ============================================================================
   16.  BALL
   ========================================================================== */
const BALL_R = 0.11;
const GROUND_Y = 0.02;

function makeBallTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#f4f2ea'; g.fillRect(0, 0, 128, 128);
  g.fillStyle = '#141414';
  const spots = [[22,22],[86,20],[54,62],[20,102],[88,104],[112,60],[0,60],[64,128],[64,-4]];
  for (const [cx, cy] of spots) {
    g.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI/2 + i * TAU/5;
      const px = cx + Math.cos(a) * 13, py = cy + Math.sin(a) * 13;
      if (i === 0) g.moveTo(px, py); else g.lineTo(px, py);
    }
    g.closePath(); g.fill();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const ball = {
  pos: new THREE.Vector3(PITCH.cx, GROUND_Y + BALL_R, PITCH.cz),
  prevPos: new THREE.Vector3(),
  vel: new THREE.Vector3(),
  mesh: null,
  goalCooldown: 0, resetTimer: 0,
  lastKicker: null,
  spinAxis: new THREE.Vector3(),
  asleep: false
};

function buildBall() {
  const geo = new THREE.SphereGeometry(BALL_R, 12, 10);
  const mat = new THREE.MeshLambertMaterial({ map: makeBallTexture() });
  ball.mesh = new THREE.Mesh(geo, mat);
  ball.mesh.position.copy(ball.pos);
  scene.add(ball.mesh);
}

const kickRing = new THREE.Mesh(
  new THREE.RingGeometry(0.28, 0.36, 16).rotateX(-Math.PI/2),
  new THREE.MeshBasicMaterial({ color:0xffd23f, transparent:true, opacity:0.85,
                                side:THREE.DoubleSide, depthWrite:false })
);
kickRing.visible = false;
scene.add(kickRing);

/* Reduced physics rate: 60 Hz (was 120) — enough for a football */
const FIXED_DT = 1/60;
let ballAccum = 0;
const SLEEP_EPS = 0.06;

function resetBall() {
  ball.pos.set(PITCH.cx, GROUND_Y + BALL_R, PITCH.cz);
  ball.vel.set(0, 0, 0);
  ball.lastKicker = null;
  ball.asleep = false;
}

function stepBall(dt) {
  ball.prevPos.copy(ball.pos);

  ball.vel.y -= 9.81 * dt;
  const sp = ball.vel.length();
  if (sp > 0.02) ball.vel.multiplyScalar(Math.exp(-0.20 * dt));
  ball.pos.addScaledVector(ball.vel, dt);

  const floor = GROUND_Y + BALL_R;
  if (ball.pos.y < floor) {
    ball.pos.y = floor;
    if (ball.vel.y < 0) {
      const impact = -ball.vel.y;
      if (impact > 1.2) playBounce(Math.min(1, impact / 9));
      ball.vel.y = impact * 0.55;
      ball.vel.x *= 0.86; ball.vel.z *= 0.86;
      if (Math.abs(ball.vel.y) < 0.55) ball.vel.y = 0;
    }
    const hs = Math.hypot(ball.vel.x, ball.vel.z);
    if (hs > 0.001) {
      const f = Math.exp(-1.45 * dt);
      ball.vel.x *= f; ball.vel.z *= f;
      if (hs < 0.09) { ball.vel.x = 0; ball.vel.z = 0; }
    }
  }

  const inGoalZ = Math.abs(ball.pos.z - PITCH.cz) < GOAL_W/2 + 0.02;
  const underBar = ball.pos.y < GOAL_H;

  if (ball.pos.x < PB.minX + BALL_R) {
    const insideGoal = inGoalZ && underBar && ball.pos.x > PB.minX - GOAL_DEPTH - 0.15;
    if (!insideGoal) { ball.pos.x = PB.minX + BALL_R; ball.vel.x = Math.abs(ball.vel.x) * 0.55; }
  }
  if (ball.pos.x > PB.maxX - BALL_R) {
    const insideGoal = inGoalZ && underBar && ball.pos.x < PB.maxX + GOAL_DEPTH + 0.15;
    if (!insideGoal) { ball.pos.x = PB.maxX - BALL_R; ball.vel.x = -Math.abs(ball.vel.x) * 0.55; }
  }
  if (ball.pos.z < PB.minZ + BALL_R) { ball.pos.z = PB.minZ + BALL_R; ball.vel.z = Math.abs(ball.vel.z) * 0.55; }
  if (ball.pos.z > PB.maxZ - BALL_R) { ball.pos.z = PB.maxZ - BALL_R; ball.vel.z = -Math.abs(ball.vel.z) * 0.55; }

  const westBox = ball.pos.x < PB.minX && ball.pos.x > PB.minX - GOAL_DEPTH;
  const eastBox = ball.pos.x > PB.maxX && ball.pos.x < PB.maxX + GOAL_DEPTH;
  if ((westBox || eastBox) && inGoalZ) {
    ball.vel.multiplyScalar(Math.exp(-7.5 * dt));
    const backX = westBox ? PB.minX - GOAL_DEPTH + BALL_R : PB.maxX + GOAL_DEPTH - BALL_R;
    if (westBox && ball.pos.x < backX) { ball.pos.x = backX; ball.vel.x = Math.abs(ball.vel.x) * 0.15; }
    if (eastBox && ball.pos.x > backX) { ball.pos.x = backX; ball.vel.x = -Math.abs(ball.vel.x) * 0.15; }
  }

  const collidePost = (px, pz) => {
    const ddx = ball.pos.x - px, ddz = ball.pos.z - pz;
    const d2 = ddx*ddx + ddz*ddz, minD = BALL_R + 0.07;
    if (d2 < minD*minD && d2 > 1e-9 && ball.pos.y < GOAL_H + 0.05) {
      const d = Math.sqrt(d2), nx = ddx/d, nz = ddz/d;
      ball.pos.x = px + nx*minD;
      ball.pos.z = pz + nz*minD;
      const vn = ball.vel.x*nx + ball.vel.z*nz;
      if (vn < 0) {
        ball.vel.x -= 1.6 * vn * nx;
        ball.vel.z -= 1.6 * vn * nz;
        playPost();
      }
    }
  };
  const zP1 = PITCH.cz - GOAL_W/2, zP2 = PITCH.cz + GOAL_W/2;
  collidePost(PB.minX, zP1); collidePost(PB.minX, zP2);
  collidePost(PB.maxX, zP1); collidePost(PB.maxX, zP2);

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Clinmoji — Character Studio</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#0e1116;--panel:#161b23;--panel2:#1d232d;--line:#2a323f;
    --ink:#eef2f7;--dim:#8b97a8;--gold:#e0b13c;color-scheme:dark;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px)}
  body{background:radial-gradient(1200px 700px at 20% -10%,#1a2333,#0e1116 60%)
    var(--bg);
    color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;padding:16px}
  #app{max-width:1180px;margin:0 auto}
  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .brand{display:flex;align-items:center;gap:9px}
  .logo{width:30px;height:30px;border-radius:9px;display:grid;
    place-items:center;font-weight:800;font-size:15px;color:#1a1305;
    background:linear-gradient(145deg,#f0c860,#c99a20);
    box-shadow:0 2px 8px rgba(224,177,60,.35)}
  h1{font-size:19px;letter-spacing:.3px;font-weight:700}
  h1 span{color:var(--gold)}
  .tag{font-size:11px;color:var(--dim);border:1px solid var(--line);
    padding:3px 9px;border-radius:999px}
  .spacer{flex:1}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--ink);padding:8px 14px;
    border-radius:10px;transition:background .15s,border-color .15s,
      transform .1s}
  button:hover{background:#26303d;border-color:#3a4657}
  button:active{transform:translateY(1px)}
  button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  button.gold{background:linear-gradient(180deg,#e8bf55,#c99a20);color:#1a1305;
    border-color:#a97f12;font-weight:600}
  button.green{background:linear-gradient(180deg,#14b866,#0b8b4b);
    border-color:#0a7a42;font-weight:600}
  .gswitch{display:flex;background:#131920;border:1px solid var(--line);
    border-radius:10px;overflow:hidden}
  .gswitch button{border:0;border-radius:0;padding:8px 14px;
    background:transparent;font-size:12px}
  .gswitch button.on{background:var(--gold);color:#1a1305;font-weight:700}
  #stage{background:linear-gradient(180deg,#1b2330,#12171f);
    border:1px solid var(--line);border-radius:18px;padding:8px;
    position:relative;overflow:hidden;max-width:560px;margin:0 auto;
    box-shadow:0 20px 60px rgba(0,0,0,.45),0 0 0 1px rgba(224,177,60,.05) inset}
  #avatar{width:100%;height:auto;display:block;max-height:78vh}
  #overlay{position:fixed;inset:0;background:rgba(5,8,12,.72);
    backdrop-filter:blur(6px);display:none;align-items:center;
    justify-content:center;padding:18px;z-index:50}
  #overlay.on{display:flex}
  #modal{width:min(960px,100%);max-height:88vh;background:var(--panel);
    border:1px solid var(--line);border-radius:18px;display:flex;
    flex-direction:column;overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.7)}
  .mhead{display:flex;align-items:center;gap:12px;padding:14px 18px;
    border-bottom:1px solid var(--line)}
  .mhead h2{font-size:15px;font-weight:700}
  .mhead .x{margin-left:auto;width:32px;height:32px;border-radius:50%;
    display:grid;place-items:center;font-size:18px;line-height:1;padding:0}
  .mbody{display:grid;grid-template-columns:190px 1fr;min-height:0;flex:1}
  @media(max-width:640px){.mbody{grid-template-columns:1fr}
    #sidebar{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);
      padding:8px 10px;gap:6px;border-right:none}
    #sidebar button{flex:0 0 auto}}
  #sidebar{padding:12px;border-right:1px solid var(--line);overflow-y:auto;
    display:flex;flex-direction:column;gap:4px;background:#131920}
  #sidebar button{text-align:left;padding:8px 11px;font-size:12.5px;
    border-radius:9px;background:transparent;color:var(--dim);border-color:transparent}
  #sidebar button.on{background:#221c0c;color:var(--gold);
    border-color:var(--gold);font-weight:700}
  #sidebar button:hover{background:#1d232d;color:var(--ink)}
  #options{padding:14px;overflow-y:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:9px;
    align-content:start}
  #options::-webkit-scrollbar,#sidebar::-webkit-scrollbar{width:8px}
  #options::-webkit-scrollbar-thumb,#sidebar::-webkit-scrollbar-thumb{
    background:#2c3542;border-radius:8px}
  .opt{display:flex;align-items:center;gap:8px;padding:8px 9px;
    border:1px solid var(--line);border-radius:10px;background:#131920;
    cursor:pointer;font-size:11.5px;transition:.12s;user-select:none}
  .opt:hover{background:#1b2431;transform:translateY(-1px)}
  .opt.on{border-color:var(--gold);background:#221c0c;
    box-shadow:0 0 0 1px var(--gold) inset}
  .dot{width:13px;height:13px;border-radius:50%;flex:0 0 auto;
    border:1px solid rgba(255,255,255,.25)}
  .opt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sw2{width:100%;aspect-ratio:1;border-radius:10px;cursor:pointer;
    border:2px solid transparent;transition:.12s;position:relative}
  .sw2:hover{transform:scale(1.06)}
  .sw2.on{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.3)}
  .sw2 b{position:absolute;left:5px;bottom:3px;font-size:9px;font-weight:500;
    color:#fff;text-shadow:0 1px 3px #000,0 0 6px #000}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <div class="logo">C</div>
      <h1>Clin<span>moji</span></h1>
    </div>
    <span class="tag">Character Studio</span>
    <div class="gswitch" role="group" aria-label="Choose body type">
      <button id="gM" aria-pressed="true">♂ Male</button>
      <button id="gF" aria-pressed="false">♀ Female</button>
    </div>
    <div class="spacer"></div>
    <button id="open" class="gold">✎ Customize</button>
    <button id="rand">🎲 Shuffle</button>
    <button id="dl" class="green">⬇ Save PNG</button>
  </header>
  <main><div id="stage">
    <svg id="avatar" viewBox="0 0 400 780"
         xmlns="http://www.w3.org/2000/svg"></svg>
  </div></main>
</div>

<div id="overlay">
  <div id="modal">
    <div class="mhead">
      <h2 id="mtitle">Customize</h2>
      <button class="x" id="close">✕</button>
    </div>
    <div class="mbody">
      <div id="sidebar"></div>
      <div id="options"></div>
    </div>
  </div>
</div>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════
   0. SVG PLUMBING
   ═══════════════════════════════════════════════════════════════════ */
const NS="http://www.w3.org/2000/svg",CX=200;
const E=(t,a,k)=>{const n=document.createElementNS(NS,t);
  if(a)for(const q in a)if(a[q]!=null)n.setAttribute(q,a[q]);
  if(k)(Array.isArray(k)?k:[k]).forEach(c=>c&&n.appendChild(c));
  return n;};
const P=(d,a)=>E("path",Object.assign({d},a||{}));
const C=(cx,cy,r,a)=>E("circle",Object.assign({cx,cy,r},a||{}));
const EL=(cx,cy,rx,ry,a)=>E("ellipse",Object.assign({cx,cy,rx,ry},a||{}));
const RECT=(x,y,w,h,a)=>E("rect",
  Object.assign({x,y,width:w,height:h},a||{}));
const NN=v=>Number.isFinite(v)?v:0;
const S=v=>{const n=NN(v);const c=Math.max(-100000,Math.min(100000,n));
  return (Math.round(c*10)/10).toFixed(1);};
const shade=(hex,amt)=>{const n=parseInt(hex.slice(1),16);
  let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=Math.max(0,Math.min(255,Math.round(r+amt)));
  g=Math.max(0,Math.min(255,Math.round(g+amt)));
  b=Math.max(0,Math.min(255,Math.round(b+amt)));
  return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);};
const lerp=(a,b,t)=>a+(b-a)*t;

/* ═══════════════════════════════════════════════════════════════════
   1. SKIN (20)
   ═══════════════════════════════════════════════════════════════════ */
const SKIN=[
  {n:"Ebony",c:"#33200F"},{n:"Deep Cocoa",c:"#3B2513"},
  {n:"Dark Roast",c:"#442A17"},{n:"Bitter Choc",c:"#4D301B"},
  {n:"Espresso",c:"#56351F"},{n:"Mocha",c:"#5F3B24"},
  {n:"Chestnut",c:"#684129"},{n:"Warm Sienna",c:"#71472E"},
  {n:"Caramel",c:"#7A4E34"},{n:"Toffee",c:"#83553A"},
  {n:"Amber",c:"#8C5C40"},{n:"Honey",c:"#956347"},
  {n:"Golden",c:"#9E6B4E"},{n:"Almond",c:"#A87456"},
  {n:"Sand",c:"#B27D5F"},{n:"Tan",c:"#BC8769"},
  {n:"Beige",c:"#C69174"},{n:"Light Tan",c:"#D09C80"},
  {n:"Fair",c:"#DAAB92"},{n:"Porcelain",c:"#E5BCA6"}
];

/* ═══════════════════════════════════════════════════════════════════
   2. BODY (20)
   ═══════════════════════════════════════════════════════════════════ */
const BODIES=[
  {n:"Slim",sh:.90,wa:.84,hi:.88,ar:1.02,le:1.04,nk:.88},
  {n:"Lean",sh:.94,wa:.88,hi:.92,ar:1.01,le:1.02,nk:.92},
  {n:"Athletic",sh:1.06,wa:.95,hi:1.00,ar:1.02,le:1.00,nk:1.02},
  {n:"Toned",sh:1.02,wa:.92,hi:.98,ar:1.00,le:1.00,nk:1.00},
  {n:"Average",sh:1.00,wa:1.00,hi:1.00,ar:1.00,le:1.00,nk:1.00},
  {n:"Curvy",sh:.98,wa:.92,hi:1.18,ar:.98,le:.98,nk:.96},
  {n:"Hourglass",sh:1.00,wa:.82,hi:1.16,ar:.99,le:1.00,nk:.96},
  {n:"Pear",sh:.94,wa:.92,hi:1.22,ar:.97,le:.99,nk:.94},
  {n:"Apple",sh:1.02,wa:1.18,hi:1.10,ar:.98,le:.97,nk:1.00},
  {n:"Plus",sh:1.10,wa:1.32,hi:1.34,ar:.96,le:.96,nk:1.04},
  {n:"Statuesque",sh:.98,wa:.90,hi:.98,ar:1.10,le:1.12,nk:.96},
  {n:"Petite",sh:.92,wa:.94,hi:.96,ar:.86,le:.86,nk:.92},
  {n:"Broad",sh:1.18,wa:1.08,hi:1.06,ar:1.00,le:1.00,nk:1.10},
  {n:"Stocky",sh:1.14,wa:1.22,hi:1.14,ar:.97,le:.94,nk:1.06},
  {n:"Willowy",sh:.88,wa:.82,hi:.90,ar:1.08,le:1.08,nk:.88},
  {n:"Voluptuous",sh:1.00,wa:.96,hi:1.28,ar:.98,le:.98,nk:.98},
  {n:"Muscular",sh:1.22,wa:1.02,hi:1.02,ar:1.04,le:1.02,nk:1.14},
  {n:"Round",sh:1.06,wa:1.28,hi:1.26,ar:.95,le:.95,nk:1.02},
  {n:"Tall",sh:1.00,wa:.94,hi:.98,ar:1.12,le:1.14,nk:.96},
  {n:"Compact",sh:1.04,wa:1.04,hi:1.08,ar:.88,le:.88,nk:1.00}
];

/* ═══════════════════════════════════════════════════════════════════
   3. RIG
   ═══════════════════════════════════════════════════════════════════ */
function rig(b,gender){
  /* base physique differs by gender — broader shoulders & neck,
     narrower hips for male; the reverse for female — layered on
     top of whichever of the 20 shared body-type presets is chosen */
  const gm=gender==="f"
    ?{sh:.93,wa:.97,hi:1.09,nk:.92}
    :{sh:1.08,wa:1.0,hi:.93,nk:1.08};
  const shH=86*b.sh*gm.sh,chH=shH*.94,
    waH=56*b.wa*gm.wa,hiH=68*b.hi*gm.hi,nkH=20*b.nk*gm.nk;
  const shY=322,chY=388,waY=452,hiY=508;
  const knY=hiY+94*b.le,anY=knY+92*b.le,ftY=anY+12;
  const armL={sx:200-shH*.90,sy:shY+8,ex:200-shH*1.05,ey:shY+116*b.ar,
    wx:200-shH*.98,wy:shY+206*b.ar};
  const armR={sx:200+shH*.90,sy:shY+8,ex:200+shH*1.05,ey:shY+116*b.ar,
    wx:200+shH*.98,wy:shY+206*b.ar};
  const off=hiH*.46;
  const legL={hx:200-off,hy:hiY-6,kx:200-off-2,ky:knY,
    ax:200-off-3,ay:anY};
  const legR={hx:200+off,hy:hiY-6,kx:200+off+2,ky:knY,
    ax:200+off+3,ay:anY};
  return{shoulderHalf:shH,chestHalf:chH,waistHalf:waH,hipHalf:hiH,
    neckHalf:nkH,shoulderY:shY,chestY:chY,waistY:waY,hipY:hiY,
    kneeY:knY,ankleY:anY,footY:ftY,armL,armR,legL,legR,b};
}
function bodyWidthAt(r,y){
  const p=[[r.shoulderY-12,r.shoulderHalf*.60],
    [r.shoulderY,r.shoulderHalf],[r.chestY,r.chestHalf],
    [r.waistY,r.waistHalf],[r.hipY,r.hipHalf]];
  if(y<=p[0][0])return p[0][1];
  for(let i=0;i<p.length-1;i++){
    const a=p[i],c=p[i+1];
    if(y<=c[0]){const t=(y-a[0])/(c[0]-a[0]);
      return a[1]+(c[1]-a[1])*t;}}
  return p[p.length-1][1];
}
function shapeFromPts(pts){
  if(!pts||pts.length<2)return "";
  const n=pts.length,c=i=>(pts[i][2]==null?CX:NN(pts[i][2]));
  let d=`M ${S(c(0)+NN(pts[0][1]))} ${S(pts[0][0])}`;
  for(let i=0;i<n-1;i++){
    const y1=NN(pts[i][0]),w1=NN(pts[i][1]);
    const y2=NN(pts[i+1][0]),w2=NN(pts[i+1][1]);
    const my=(y1+y2)/2;
    d+=` C ${S(c(i)+w1)} ${S(my)} ${S(c(i+1)+w2)} ${S(my)} `
       +`${S(c(i+1)+w2)} ${S(y2)}`;}
  d+=` L ${S(c(n-1)-NN(pts[n-1][1]))} ${S(pts[n-1][0])}`;
  for(let i=n-1;i>0;i--){
    const y1=NN(pts[i][0]),w1=NN(pts[i][1]);
    const y2=NN(pts[i-1][0]),w2=NN(pts[i-1][1]);
    const my=(y1+y2)/2;
    d+=` C ${S(c(i)-w1)} ${S(my)} ${S(c(i-1)-w2)} ${S(my)} `
       +`${S(c(i-1)-w2)} ${S(y2)}`;}
  return d+" Z";
}
function band(r,y0,y1,ease,flare){
  const pts=[],N=8;
  for(let i=0;i<=N;i++){const t=i/N,y=y0+(y1-y0)*t;
    pts.push([y,Math.max(4,bodyWidthAt(r,Math.min(y,r.hipY+30))
      +(ease||0)+(flare||0)*t*t)]);}
  return shapeFromPts(pts);
}
function legAt(r,side,y){
  const L=side<0?r.legL:r.legR;
  const K=[[L.hy,L.hx,25],[L.ky,L.kx,19],[L.ay,L.ax,16]];
  if(y<=K[0][0])return{x:K[0][1],w:K[0][2]};
  for(let i=0;i<K.length-1;i++){
    const a=K[i],b=K[i+1];
    if(y<=b[0]){const t=(y-a[0])/(b[0]-a[0]);
      return{x:a[1]+(b[1]-a[1])*t,w:a[2]+(b[2]-a[2])*t};}}
  return{x:K[2][1],w:K[2][2]};
}
function qSplit(x0,y0,x1,y1,x2,y2,t){
  const ax=x0+(x1-x0)*t,ay=y0+(y1-y0)*t;
  const bx=x1+(x2-x1)*t,by=y1+(y2-y1)*t;
  return{c1:[ax,ay],c2:[bx,by],
    end:[ax+(bx-ax)*t,ay+(by-ay)*t]};
}

/* ═══════════════════════════════════════════════════════════════════
   4. FACE GEOMETRY
   ═══════════════════════════════════════════════════════════════════ */
const FACE={
  headTop:85,headBot:272,eyeY:196,eyeDX:33,
  browY:163,noseY:214,mouthY:243,earY:192,
  neckTop:238,neckBot:322
};
const HEAD_PATH=
  "M200 85 C246 85 277 122 277 172 C277 208 266 234 240 255 "+
  "C227 266 213 272 200 272 C187 272 173 266 160 255 "+
  "C134 234 123 208 123 172 C123 122 154 85 200 85 Z";
/* ── head-boundary sampler ───────────────────────────────────
   Samples the right-hand half of HEAD_PATH's bezier curves so any
   facial feature can be clamped to the real silhouette at its own
   y-position — this is what keeps eyes/brows/nose/mouth from ever
   drawing past the edge of the face on wide presets. */
const HEAD_BOUNDARY=(()=>{
  const segs=[
    [[200,85],[246,85],[277,122],[277,172]],
    [[277,172],[277,208],[266,234],[240,255]],
    [[240,255],[227,266],[213,272],[200,272]]
  ];
  const pts=[];
  segs.forEach(([p0,p1,p2,p3])=>{
    for(let i=0;i<=24;i++){
      const t=i/24,mt=1-t;
      const x=mt*mt*mt*p0[0]+3*mt*mt*t*p1[0]+3*mt*t*t*p2[0]+t*t*t*p3[0];
      const y=mt*mt*mt*p0[1]+3*mt*mt*t*p1[1]+3*mt*t*t*p2[1]+t*t*t*p3[1];
      pts.push([y,x-200]);
    }
  });
  pts.sort((a,b)=>a[0]-b[0]);
  return pts;
})();
function headHalfWidthAt(y){
  const pts=HEAD_BOUNDARY;
  if(y<=pts[0][0])return pts[0][1];
  if(y>=pts[pts.length-1][0])return pts[pts.length-1][1];
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i],b=pts[i+1];
    if(y<=b[0]){
      if(b[0]===a[0])return a[1];
      const tt=(y-a[0])/(b[0]-a[0]);
      return a[1]+(b[1]-a[1])*tt;
    }
  }
  return pts[pts.length-1][1];
}
function cap(vol,side,hl){
  vol=NN(vol);side=NN(side);hl=hl==null?134:NN(hl);
  const L=123-side,R=277+side,T=78-vol;
  return `M ${S(L)} 176 C ${S(L-7)} ${S(106-vol)} 155 ${S(T)} 200 ${S(T)} `
    +`C 245 ${S(T)} ${S(R+7)} ${S(106-vol)} ${S(R)} 176 `
    +`C ${S(R-2)} 176 ${S(R-8)} ${S(hl+20)} ${S(R-28)} ${S(hl+7)} `
    +`C ${S(R-48)} ${S(hl-7)} 214 ${S(hl)} 200 ${S(hl)} `
    +`C 186 ${S(hl)} 168 ${S(hl-7)} ${S(L+28)} ${S(hl+7)} `
    +`C ${S(L+8)} ${S(hl+20)} ${S(L+2)} 176 ${S(L)} 176 Z`;
}

/* ═══════════════════════════════════════════════════════════════════
   5. HAIR (20)
   ═══════════════════════════════════════════════════════════════════ */
const HAIR=[
  {n:"Bald Fade",c:"#2A1A0E",draw:(gb,gf,c)=>{
    gf.appendChild(P(cap(-2,-8,152),{fill:c,opacity:.7}));}},
  {n:"Low Cut",c:"#1C1209",draw:(gb,gf,c)=>{
    gf.appendChild(P(cap(1,-2,144),{fill:c}));
    for(let i=0;i<9;i++)gf.appendChild(P(
      `M ${132+i*17} 150 q 8 -22 22 -34`,
      {fill:"none",stroke:c,"stroke-width":2.4,opacity:.6,
       "stroke-linecap":"round"}));}},
  {n:"Short Afro",c:"#241608",draw:(gb,gf,c)=>{
    gb.appendChild(C(200,142,96,{fill:c}));
    for(let i=0;i<11;i++){const a=Math.PI*(1+i/10);
      gb.appendChild(C(200+Math.cos(a)*95,150+Math.sin(a)*88,13,
        {fill:c}));}
    gf.appendChild(P(cap(16,7,138),{fill:c}));}},
  {n:"Big Afro",c:"#150D06",draw:(gb,gf,c)=>{
    gb.appendChild(C(200,140,124,{fill:c}));
    for(let i=0;i<16;i++){const a=Math.PI*2*i/16;
      gb.appendChild(C(200+Math.cos(a)*120,148+Math.sin(a)*112,20,
        {fill:c}));}
    gf.appendChild(P(cap(22,10,134),{fill:c}));}},
  {n:"Twists",c:"#1A1008",draw:(gb,gf,c)=>{
    gb.appendChild(C(200,145,96,{fill:c}));
    gf.appendChild(P(cap(14,5,138),{fill:c}));
    for(let i=0;i<13;i++){const x=124+i*12.6;
      gf.appendChild(P(
        `M ${x} 132 Q ${x+Math.sin(i)*7} 96 `
        +`${x+Math.sin(i)*3} ${72+Math.abs(Math.sin(i))*10}`,
        {fill:"none",stroke:shade(c,26),"stroke-width":5,
         "stroke-linecap":"round"}));}}},
  {n:"Locs",c:"#140C06",draw:(gb,gf,c)=>{
    gb.appendChild(P(
      `M 118 150 C 96 220 92 330 104 430 L 150 430 `
      +`C 138 320 142 220 152 160 Z`,{fill:c}));
    gb.appendChild(P(
      `M 282 150 C 304 220 308 330 296 430 L 250 430 `
      +`C 262 320 258 220 248 160 Z`,{fill:c}));

function buildLashGroup(l,mirror,eye){
  if(!l.t)return null;
  const tr=`translate(${mirror?-FACE.eyeDX+200:FACE.eyeDX+200},`
    +`${FACE.eyeY}) scale(${mirror?-1:1},1)`;
  const grp=E("g",{transform:tr});
  const w=eye.w,h=eye.h;
  grp.appendChild(P(
    `M ${S(-w)} ${S(h*.05)} C ${S(-w)} ${S(-h*eye.lid)} `
    +`${S(-w*.45)} ${S(-h*1.3)} 0 ${S(-h*1.25)} `
    +`C ${S(w*.45)} ${S(-h*1.3)} ${S(w)} ${S(-h*eye.lid)} `
    +`${S(w)} ${S(h*.05)}`,
    {fill:"none",stroke:l.col,"stroke-width":l.t,
     "stroke-linecap":"round"}));
  if(l.wing)grp.appendChild(P(
    `M ${S(w-1)} ${S(-h*.5)} Q ${S(w+l.wing*.55)} `
    +`${S(-h*.8)} ${S(w+l.wing)} ${S(-h*1.15)}`,
    {fill:"none",stroke:l.col,"stroke-width":l.t*.85,
     "stroke-linecap":"round"}));
  const spikes=Math.round(l.t*1.3);
  for(let i=0;i<spikes;i++){
    const t=spikes>1?i/(spikes-1):0,x=-w+t*2*w;
    const yT=-h*(1.25-Math.abs(t-.5)*.55);
    const len=3.5+Math.sin(t*Math.PI)*(l.t*1.4);
    grp.appendChild(P(
      `M ${S(x)} ${S(yT)} Q ${S(x-1)} ${S(yT-len*.6)} `
      +`${S(x-2.2)} ${S(yT-len)}`,
      {fill:"none",stroke:l.col,"stroke-width":1.2,
       "stroke-linecap":"round",opacity:.95}));}
  if(l.low)for(let i=0;i<5;i++){
    const t=i/4,x=-w*.7+t*w*1.4,y=h*.9;
    grp.appendChild(P(
      `M ${S(x)} ${S(y)} Q ${S(x-1)} ${S(y+3)} `
      +`${S(x-1.8)} ${S(y+5)}`,
      {fill:"none",stroke:l.col,"stroke-width":1.1,
       "stroke-linecap":"round",opacity:.9}));}
  return grp;
}

/* open = 0..1, smile = 0..1 */
function mouthData(m,open,smile){
  const w=m.w*(1+smile*.10);
  const up=m.up*(1+smile*.15);
  const lo=m.lo;
  const cornerY=-smile*2.5;
  const topY=-up*(1+smile*.45);
  const botY=lo+open*(14+lo*1.2);
  const lip=
    `M ${S(-w)} ${S(cornerY)} `
    +`Q 0 ${S(topY)} ${S(w)} ${S(cornerY)} `
    +`Q 0 ${S(botY)} ${S(-w)} ${S(cornerY)} Z`;
  const innerW=w*.88;
  const innerTopY=topY*.85;
  const innerBotY=botY*.9;
  const inner=
    `M ${S(-innerW)} ${S(cornerY+1)} `
    +`Q 0 ${S(innerTopY+2)} ${S(innerW)} ${S(cornerY+1)} `
    +`Q 0 ${S(innerBotY-2)} ${S(-innerW)} ${S(cornerY+1)} Z`;
  const teethW=innerW*.82;
  const teethH=Math.max(1.5,innerBotY*.22);
  const teeth=
    `M ${S(-teethW)} ${S(cornerY+2)} `
    +`Q 0 ${S(innerTopY+4)} ${S(teethW)} ${S(cornerY+2)} `
    +`L ${S(teethW)} ${S(cornerY+2+teethH)} `
    +`Q 0 ${S(innerTopY+4+teethH)} `
    +`${S(-teethW)} ${S(cornerY+2+teethH)} Z`;
  return{lip,inner,teeth};
}

function buildEar(e,side,skin){
  const attachX=CX+side*(FACE.earX||76),cy=FACE.earY;

    {transform:`translate(${attachX},${cy}) scale(${side},1)`});

    +`C ${S(w*0.55)} ${S(-h*0.60)} ${S(w*1.05)} `
    +`${S(-h*0.35)} ${S(w*0.95)} ${S(-h*0.05)} `

    +`C ${S(w*0.10)} ${S(-h*0.15)} ${S(w*0.05)} `
    +`${S(-h*0.35)} 0 ${S(-h*0.50)} Z`,{fill:skin}));
  grp.appendChild(P(
    `M ${S(w*0.20)} ${S(-h*0.30)} `

    +`${S(-h*0.10)} ${S(w*0.70)} ${S(h*0.10)} `
    +`C ${S(w*0.60)} ${S(h*0.30)} ${S(w*0.45)} `

     opacity:.65}));

    S(w*0.18),S(h*0.12),{fill:shade(skin,18),opacity:.35}));
  return grp;

/* Generic lace helper — adds laces + eyelets */
function laces(g,x,y,w,h,col){
  const top=y-h*.75;
  for(let i=0;i<4;i++){
    const yy=top+i*(h*.75/3);
    g.appendChild(P(`M ${S(x-w*.6)} ${S(yy)} L ${S(x+w*.6)} ${S(yy+h*.15)}`,
      {stroke:col,"stroke-width":1.6,"stroke-linecap":"round"}));
    g.appendChild(P(`M ${S(x+w*.6)} ${S(yy)} L ${S(x-w*.6)} ${S(yy+h*.15)}`,
      {stroke:col,"stroke-width":1.6,"stroke-linecap":"round"}));
    g.appendChild(C(S(x-w*.62),S(yy+h*.075),.9,
      {fill:"#2a2a2a"}));
    g.appendChild(C(S(x+w*.62),S(yy+h*.075),.9,
      {fill:"#2a2a2a"}));
  }
}
function soleLine(g,x,y,w,h,col){
  g.appendChild(P(`M ${S(x-w)} ${S(y+h-1)} L ${S(x+w)} ${S(y+h-1)}`,
    {stroke:col,"stroke-width":2.4,"stroke-linecap":"round",
     opacity:.9}));
  g.appendChild(P(`M ${S(x-w+1)} ${S(y+h-3.5)} L ${S(x+w-1)} ${S(y+h-3.5)}`,
    {stroke:col,"stroke-width":.9,"stroke-linecap":"round",
     opacity:.55,"stroke-dasharray":"3 3"}));
}

/* ═══════════════════════════════════════════════════════════════════
   18. STATE
   ═══════════════════════════════════════════════════════════════════ */
const state={
  gender:"m",
  skin:7,body:4,hair:3,eyes:0,brows:0,lashes:1,nose:13,mouth:0,
  ears:1,neck:4,top:0,trousers:0,shoes:0,texture:0,accessory:1
};

/* ═══════════════════════════════════════════════════════════════════
   19. DEFS
   ═══════════════════════════════════════════════════════════════════ */
function buildDefs(){
  const defs=E("defs");
  TEXTURES.forEach((t,i)=>{
    const p=E("pattern",{id:`tex${i}`,width:t.s,height:t.s,
      patternUnits:"userSpaceOnUse"});
    t.draw(p);defs.appendChild(p);
  });
  const gHL=E("linearGradient",
    {id:"fabricHL",x1:"0%",y1:"0%",x2:"100%",y2:"0%"});
  gHL.appendChild(E("stop",{offset:"0%","stop-color":"#ffffff",
    "stop-opacity":".24"}));
  gHL.appendChild(E("stop",{offset:"28%","stop-color":"#ffffff",
    "stop-opacity":"0"}));
  gHL.appendChild(E("stop",{offset:"72%","stop-color":"#000000",
    "stop-opacity":"0"}));
  gHL.appendChild(E("stop",{offset:"100%","stop-color":"#000000",
    "stop-opacity":".32"}));
  defs.appendChild(gHL);
  const gVT=E("linearGradient",
    {id:"fabricVT",x1:"0%",y1:"0%",x2:"0%",y2:"100%"});
  gVT.appendChild(E("stop",{offset:"0%","stop-color":"#ffffff",
    "stop-opacity":".14"}));
  gVT.appendChild(E("stop",{offset:"55%","stop-color":"#000000",
    "stop-opacity":"0"}));
  gVT.appendChild(E("stop",{offset:"100%","stop-color":"#000000",
    "stop-opacity":".28"}));
  defs.appendChild(gVT);
  return defs;
}

/* ═══════════════════════════════════════════════════════════════════
   20. FABRIC HELPERS
   ═══════════════════════════════════════════════════════════════════ */
function fabricVolume(grp,d,col){
  grp.appendChild(P(d,{fill:col}));
  grp.appendChild(P(d,{fill:"url(#fabricHL)"}));
  grp.appendChild(P(d,{fill:"url(#fabricVT)"}));
}
function foldHints(grp,r,y0,y1,col,amt){
  amt=amt||1;
  const rows=3;
  for(let i=0;i<rows;i++){
    const y=y0+(y1-y0)*((i+.5)/rows);
    const w=bodyWidthAt(r,Math.min(y,r.hipY+20))*0.65;
    const cx=CX+((i%2)?10:-10);
    grp.appendChild(P(
      `M ${S(cx-w)} ${S(y)} Q ${S(cx)} ${S(y+6*amt)} `
      +`${S(cx+w)} ${S(y-2*amt)}`,
      {fill:"none",stroke:shade(col,-38),"stroke-width":1.1,
       opacity:.28,"stroke-linecap":"round"}));
  }
}
function edgeHighlight(grp,d){
  grp.appendChild(P(d,{fill:"none",stroke:"#ffffff",
    "stroke-width":1.2,opacity:.12,
    "stroke-dasharray":"2 6","stroke-linecap":"round"}));
}

      +`C ${S(CX+34)} ${S(y+22)} ${S(CX-34)} ${S(y+22)} `

      +`${S(y+34)} ${S(CX+nw)} ${S(y)} L ${S(CX+nw)} `
      +`${S(y+8)} Q ${S(CX)} ${S(y+42)} ${S(CX-nw)} `

  if(type==="suit"){

function drawTop(g,r,t,texIdx){
  /* start higher so the top covers the base of the neck */
  const yStart=r.shoulderY-32;
  const endY=r.hipY+t.end*140;
  const d=band(r,yStart,endY,t.ease*2+t.flare*2,t.flare*2);
  const grp=E("g");
  fabricVolume(grp,d,t.col);
  if(texIdx)grp.appendChild(P(d,{fill:`url(#tex${texIdx})`}));
  grp.appendChild(P(d,{fill:"none",stroke:shade(t.col,-52),
    "stroke-width":1.4}));
  edgeHighlight(grp,d);
  foldHints(grp,r,yStart+30,Math.max(yStart+50,endY-16),t.col);
  /* NOTE: sleeves are no longer drawn here — they're drawn inside
     each arm's own rotating group (see drawSleeveOnArm) so the
     fabric swings together with the arm instead of staying static. */
  grp.appendChild(neckline(r,t.neck,t.col));
  if(t.emb==="dashiki"){
    for(let i=0;i<5;i++){
      grp.appendChild(P(
        `M ${S(CX-14)} ${S(r.shoulderY+30+i*16)} L ${S(CX)} `
        +`${S(r.shoulderY+38+i*16)} L ${S(CX+14)} `
        +`${S(r.shoulderY+30+i*16)}`,
        {fill:"none",stroke:"#F0C64A","stroke-width":2.2,
         "stroke-linecap":"round"}));
    }
  }
  if(t.neck==="hood"){
    grp.appendChild(P(`M ${S(CX-48)} ${S(r.waistY+8)} `
      +`L ${S(CX+48)} ${S(r.waistY+8)} L ${S(CX+48)} `
      +`${S(r.waistY+42)} L ${S(CX-48)} ${S(r.waistY+42)} Z`,
      {fill:shade(t.col,-16),stroke:shade(t.col,-50),
       "stroke-width":1.4,rx:6}));
  }
  g.appendChild(grp);
}

function drawTrousers(g,r,t,texIdx){
  const grp=E("g");
  const yTop=r.hipY-2;
  const endY=t.end==="knee"?r.kneeY
    :(t.end==="calf"?r.kneeY+40:r.ankleY+4);

  if(t.fit==="skirt"){
    const A=yTop,B=yTop+30,
      Cc=Math.max(B+5,endY-10),D=Math.max(Cc+5,endY);
    const d=shapeFromPts([
      [A,r.hipHalf+4],[B,r.hipHalf+6+t.ease*.5],
      [Cc,r.hipHalf+8+t.ease*.8],[D,r.hipHalf+10+t.ease]
    ]);
    fabricVolume(grp,d,t.col);
    if(texIdx)grp.appendChild(P(d,{fill:`url(#tex${texIdx})`}));
    grp.appendChild(P(d,{fill:"none",stroke:shade(t.col,-52),
      "stroke-width":1.4}));
    for(let i=0;i<4;i++){
      const off=-36+i*24;
      grp.appendChild(P(
        `M ${S(CX+off)} ${S(A+10)} Q ${S(CX+off*1.4)} `
        +`${S((A+D)/2)} ${S(CX+off*1.6)} ${S(D-6)}`,
        {fill:"none",stroke:shade(t.col,-40),"stroke-width":1.1,
         opacity:.3}));
    }
    grp.appendChild(P(`M ${S(CX)} ${S(A+6)} L ${S(CX)} ${S(D-4)}`,
      {stroke:shade(t.col,-46),"stroke-width":1.4,opacity:.6}));
    g.appendChild(grp);return;
  }

  [-1,1].forEach(side=>{
    const L=side<0?r.legL:r.legR;
    const pts=[];
    const STEPS=7;
    for(let i=0;i<=STEPS;i++){
      const tt=i/STEPS,y=yTop+(endY-yTop)*tt;
      const a=legAt(r,side,y);
      const extra=t.ease*(0.6+tt*0.4);
      pts.push([y,a.w+extra,a.x]);
    }
    const d=shapeFromPts(pts);
    fabricVolume(grp,d,t.col);
    if(texIdx)grp.appendChild(P(d,{fill:`url(#tex${texIdx})`}));
    grp.appendChild(P(d,{fill:"none",stroke:shade(t.col,-52),
      "stroke-width":1.4}));
    grp.appendChild(P(
      `M ${S(L.hx)} ${S(yTop+8)} L ${S(L.ax)} ${S(endY-8)}`,
      {stroke:shade(t.col,-40),"stroke-width":1.1,opacity:.5}));
    if(t.end==="ankle"){
      const a=legAt(r,side,endY-8);
      grp.appendChild(RECT(S(a.x-a.w-4),S(endY-10),
        S((a.w+4)*2),8,{rx:3,fill:shade(t.col,-24)}));
      grp.appendChild(P(
        `M ${S(a.x-a.w-2)} ${S(endY-6)} L ${S(a.x+a.w+2)} `
        +`${S(endY-6)}`,
        {stroke:shade(t.col,-58),"stroke-width":1,
         "stroke-dasharray":"2 3"}));
    }
    if(t.n&&t.n.indexOf("Cargo")>=0){
      const kneeW=legAt(r,side,r.kneeY).w;
      grp.appendChild(RECT(S(L.kx-kneeW-2),S(r.kneeY-24),
        20,22,{rx:3,fill:shade(t.col,-14),
        stroke:shade(t.col,-50),"stroke-width":1}));
      grp.appendChild(P(
        `M ${S(L.kx-kneeW-2)} ${S(r.kneeY-18)} `
        +`L ${S(L.kx-kneeW+18)} ${S(r.kneeY-18)}`,
        {stroke:shade(t.col,-60),"stroke-width":1,
         "stroke-dasharray":"2 2"}));
    }
  });
  g.appendChild(grp);
}

/* ═══════════════════════════════════════════════════════════════════
   22. SMOOTH ARM / LEG  (limb bodies only — no hands)
   ═══════════════════════════════════════════════════════════════════ */
function drawSleeveOnArm(armGrp,a,t,texIdx){
  if(!(t.sl>0))return;
  const q=qSplit(a.sx,a.sy,a.ex,a.ey,a.wx,a.wy,t.sl);
  const sd=`M ${S(a.sx)} ${S(a.sy)} Q ${S(q.c1[0])} `
    +`${S(q.c1[1])} ${S(q.c2[0])} ${S(q.c2[1])} `
    +`${S(q.end[0])} ${S(q.end[1])}`;
  const w=t.sl>0.7?22:26;
  armGrp.appendChild(P(sd,{fill:"none",stroke:t.col,
    "stroke-width":w,"stroke-linecap":"round"}));
  if(texIdx)armGrp.appendChild(P(sd,{fill:"none",
    stroke:`url(#tex${texIdx})`,"stroke-width":w,
    "stroke-linecap":"round"}));
  armGrp.appendChild(P(sd,{fill:"none",stroke:"#fff",
    "stroke-width":w*.35,"stroke-linecap":"round",
    opacity:.10}));
  armGrp.appendChild(C(S(a.sx),S(a.sy),w/2,{fill:t.col}));
  armGrp.appendChild(P(
    `M ${S(q.end[0]-w*.55)} ${S(q.end[1]-w*.2)} `
    +`A ${S(w/2)} ${S(w/2)} 0 0 1 ${S(q.end[0]+w*.55)} `
    +`${S(q.end[1]-w*.2)}`,
    {fill:"none",stroke:shade(t.col,-32),"stroke-width":4,
     "stroke-linecap":"round"}));
}
function drawArmBody(g,a,skin){
  const w=19;
  g.appendChild(P(
    `M ${S(a.sx)} ${S(a.sy)} Q ${S(a.ex)} ${S(a.ey)} `
    +`${S(a.wx)} ${S(a.wy)}`,
    {fill:"none",stroke:skin,"stroke-width":w,
     "stroke-linecap":"round"}));
  g.appendChild(C(S(a.sx),S(a.sy),w/2,{fill:skin}));
  g.appendChild(C(S(a.ex),S(a.ey),w/2*0.94,{fill:skin}));
  g.appendChild(C(S(a.wx),S(a.wy),w/2*0.98,{fill:skin}));
}
function drawLegBody(g,side,r,skin){
  const L=side<0?r.legL:r.legR;
  const pts=[],STEPS=10;
  for(let i=0;i<=STEPS;i++){
    const t=i/STEPS,y=L.hy+(L.ay-L.hy)*t;
    const a=legAt(r,side,y);
    pts.push([y,a.w,a.x]);
  }
  g.appendChild(P(shapeFromPts(pts),{fill:skin}));
  g.appendChild(C(S(L.hx),S(L.hy),25,{fill:skin}));
}

/* ═══════════════════════════════════════════════════════════════════
   23. BUILD CHARACTER  (once per state change)
   ═══════════════════════════════════════════════════════════════════ */
const REFS={};

function buildCharacter(){
  const svg=document.getElementById("avatar");
  svg.innerHTML="";
  svg.appendChild(buildDefs());

  const b=BODIES[state.body];
  const r=rig(b,state.gender);
  const skin=SKIN[state.skin].c;
  const hair=HAIR[state.hair];
  const eye=EYES[state.eyes];
  const brow=BROWS[state.brows];
  const lash=LASHES[state.lashes];
  const nose=NOSES[state.nose];
  const mouth=MOUTHS[state.mouth];
  const ear=EARS[state.ears];
  const neck=NECKS[state.neck];
  const top=TOPS[state.top];
  const trouser=TROUSERS[state.trousers];
  const shoe=SHOES[state.shoes];
  const acc=ACCESSORIES[state.accessory];

  /* ── precision clamp: keep every facial feature inside the
     actual head silhouette instead of letting wide presets draw
     past the edge of the face ─────────────────────────────── */
  const MARGIN=7;
  const browHalf=headHalfWidthAt(FACE.browY)-MARGIN;
  const eyeHalf=headHalfWidthAt(FACE.eyeY)-MARGIN;
  const eyeReach=Math.max(eye.w,brow.w*0.95,eye.w+(lash.wing||0)*0.55);
  let eyeDXc=33; // original design offset
  if(eyeDXc+eyeReach>eyeHalf)eyeDXc=Math.max(14,eyeHalf-eyeReach);
  if(eyeDXc+brow.w*0.95>browHalf)
    eyeDXc=Math.min(eyeDXc,Math.max(14,browHalf-brow.w*0.95));
  FACE.eyeDX=eyeDXc;
  FACE.earX=headHalfWidthAt(FACE.earY)*0.97;

  const mouthHalf=headHalfWidthAt(FACE.mouthY)-6;
  const mouthMaxW=Math.max(10,mouthHalf/1.12);
  const mouthClamped=mouth.w>mouthMaxW
    ?Object.assign({},mouth,{w:mouthMaxW}):mouth;

  const noseHalf=headHalfWidthAt(FACE.noseY)-6;
  const noseClamped=nose.w>noseHalf
    ?Object.assign({},nose,{w:Math.max(8,noseHalf)}):nose;

  /* ── hair back (static) ────────────────────────────────── */
  const gHairB=E("g"),gHairF=E("g");
  hair.draw(gHairB,gHairF,hair.c);
  svg.appendChild(gHairB);

  /* ── legs (skin) ───────────────────────────────────────── */
  const gLegs=E("g",{id:"gLegs"});
  drawLegBody(gLegs,-1,r,skin);
  drawLegBody(gLegs, 1,r,skin);
  svg.appendChild(gLegs);
  REFS.legs=gLegs;

  /* ── trousers ──────────────────────────────────────────── */
  const gTrousers=E("g");
  drawTrousers(gTrousers,r,trouser,state.texture);
  svg.appendChild(gTrousers);

  /* ── shoes ─────────────────────────────────────────────── */
  const gShoes=E("g");
  [-1,1].forEach(side=>{
    const L=side<0?r.legL:r.legR;
    shoe.draw(gShoes,L.ax,L.ay+4);
  });
  svg.appendChild(gShoes);

  /* ── torso + neck (skin) — smooth continuous silhouette ─ */
  const nh=r.neckHalf*neck.w;
  const neckBottom=r.shoulderY-32;
  const torsoPts=[
    [FACE.neckTop,      nh*0.95],
    [FACE.neckTop+18,   nh*0.92],
    [FACE.neckTop+38,   nh*0.98],
    [neckBottom,        nh*1.05],
    [r.shoulderY-24,    r.shoulderHalf*0.62],
    [r.shoulderY,       r.shoulderHalf],
    [r.chestY,          r.chestHalf],
    [r.waistY,          r.waistHalf],
    [r.hipY,            r.hipHalf],
    [r.hipY+26,         r.hipHalf*0.85]
  ];
  const gTorso=E("g",{id:"gTorso"});
  gTorso.appendChild(P(shapeFromPts(torsoPts),{fill:skin}));
  if(neck.def>0.3){
    gTorso.appendChild(P(
      `M ${S(CX-5)} ${S(FACE.neckTop+38)} `
      +`q 5 ${S(neck.def*5)} 10 0`,
      {fill:"none",stroke:shade(skin,-28),
       "stroke-width":1.4,opacity:neck.def}));
  }
  gTorso.appendChild(P(
    `M ${S(CX-38)} ${S(r.shoulderY+16)} Q ${S(CX)} `
    +`${S(r.shoulderY+30)} ${S(CX+38)} ${S(r.shoulderY+16)}`,
    {fill:"none",stroke:shade(skin,-24),"stroke-width":1.6,
     opacity:.4}));
  svg.appendChild(gTorso);
  REFS.torso=gTorso;

  /* ── top (torso fabric only — sleeves live on the arms) ── */
  const gTop=E("g");
  drawTop(gTop,r,top,state.texture);
  svg.appendChild(gTop);

  /* ── arms — skin + sleeve drawn into the SAME group so the
     fabric swings together with the arm-sway animation ───── */
  const gArms=E("g",{id:"gArms"});
  const gArmL=E("g",{id:"gArmL"}),gArmR=E("g",{id:"gArmR"});
  drawArmBody(gArmL,r.armL,skin);
  drawSleeveOnArm(gArmL,r.armL,top,state.texture);
  drawArmBody(gArmR,r.armR,skin);
  drawSleeveOnArm(gArmR,r.armR,top,state.texture);
  gArms.appendChild(gArmL);gArms.appendChild(gArmR);
  svg.appendChild(gArms);
  REFS.armL=gArmL;REFS.armR=gArmR;

  /* ── head group (everything that moves with the head) ── */
  const gHeadAll=E("g",{id:"gHeadAll"});
  const cxHead=CX, cyHead=FACE.neckTop+20;  // pivot near neck base

  const gHead=E("g");
  gHead.appendChild(P(HEAD_PATH,{fill:skin}));
  gHead.appendChild(P(
    `M ${S(CX-40)} ${S(FACE.mouthY+6)} Q ${S(CX)} `
    +`${S(FACE.mouthY+30)} ${S(CX+40)} ${S(FACE.mouthY+6)}`,
    {fill:"none",stroke:shade(skin,-26),"stroke-width":2,
     opacity:.25}));
  gHeadAll.appendChild(gHead);

  /* ears */
  const gEars=E("g");
  gEars.appendChild(buildEar(ear,-1,skin));
  gEars.appendChild(buildEar(ear, 1,skin));
  gHeadAll.appendChild(gEars);

  /* face features */
  const gFace=E("g");

  /* brows */
  [-1,1].forEach(s=>gFace.appendChild(P(browPath(brow),{
    fill:brow.c,
    transform:`translate(${CX+s*FACE.eyeDX},${FACE.browY}) `
      +`scale(${s},1)`})));

  /* eyes — each eye in its own group so blink can target it */
  const eyeGroups=[];
  const lidRefs=[];
  [-1,1].forEach(s=>{
    const tr=`translate(${CX+s*FACE.eyeDX},${FACE.eyeY}) `
      +`scale(${s},1) rotate(${eye.tilt})`;
    const grp=E("g",{transform:tr});
    grp.appendChild(P(eyeWhitePath(eye),{fill:"#F8F5F0"}));
    grp.appendChild(C(0,0,eye.iris,{fill:eye.c}));
    grp.appendChild(C(0,0,eye.iris*0.55,{fill:shade(eye.c,-30)}));
    grp.appendChild(C(0,0,eye.iris*0.26,{fill:"#0A0705"}));
    grp.appendChild(C(-eye.iris*0.32,-eye.iris*0.34,
      eye.iris*0.26,{fill:"#fff",opacity:.9}));
    grp.appendChild(C(eye.iris*0.28,eye.iris*0.3,
      eye.iris*0.12,{fill:"#fff",opacity:.5}));
    grp.appendChild(P(
      `M ${S(-eye.w)} 0 C ${S(-eye.w)} ${S(-eye.h*eye.lid)} `
      +`${S(-eye.w*.45)} ${S(-eye.h*1.3)} 0 ${S(-eye.h*1.25)} `
      +`C ${S(eye.w*.45)} ${S(-eye.h*1.3)} ${S(eye.w)} `
      +`${S(-eye.h*eye.lid)} ${S(eye.w)} 0`,
      {fill:"none",stroke:shade(skin,-40),"stroke-width":1.6,
       opacity:.55}));
    /* eyelid overlay (skin colour, moves down to close) —
       starts fully open (zero-height sliver sitting above the eye) */
    const lid=P(
      `M ${S(-eye.w)} ${S(-eye.h*1.4)} `
      +`L ${S(eye.w)} ${S(-eye.h*1.4)} `
      +`L ${S(eye.w)} ${S(-eye.h*1.4)} `
      +`L ${S(-eye.w)} ${S(-eye.h*1.4)} Z`,
      {fill:skin,stroke:"none"});
    grp.appendChild(lid);
    lidRefs.push({lid,eye,h:eye.h});
    eyeGroups.push(grp);
    gFace.appendChild(grp);
  });
  REFS.lids=lidRefs;

  /* lashes */
  const lashL=buildLashGroup(lash,false,eye);
  const lashR=buildLashGroup(lash,true,eye);
  if(lashL)gFace.appendChild(lashL);
  if(lashR)gFace.appendChild(lashR);

  /* nose */
  gFace.appendChild(buildNose(noseClamped,skin));

  /* mouth — assembled with separate elements so we can update */
  const mCx=CX,mCy=FACE.mouthY;
  const gMouth=E("g",
    {id:"gMouth",transform:`translate(${mCx},${mCy})`});
  const md=mouthData(mouthClamped,0,0);
  const lipEl=P(md.lip,{fill:mouthClamped.c});
  const innerEl=P(md.inner,{fill:shade(mouthClamped.c,-45),opacity:0});
  const teethEl=P(md.teeth,{fill:"#FFFFFF",opacity:0});
  const tongueEl=EL(0,mouthClamped.lo*0.6,mouthClamped.w*0.32,
    mouthClamped.lo*0.3,{fill:"#B0453F",opacity:0});
  gMouth.appendChild(innerEl);
  gMouth.appendChild(tongueEl);
  gMouth.appendChild(teethEl);
  gMouth.appendChild(lipEl);
  REFS.mouth={g:gMouth,lipEl,innerEl,teethEl,tongueEl,
    mouth:mouthClamped,lipColor:mouthClamped.c};
  gFace.appendChild(gMouth);

  /* blush */
  [-1,1].forEach(s=>gFace.appendChild(
    EL(S(CX+s*66),S(FACE.mouthY-8),17,9,
      {fill:shade(skin,26),opacity:.35})));
  gHeadAll.appendChild(gFace);

  /* front hair */
  gHeadAll.appendChild(gHairF);

  /* accessories */
  const gAcc=E("g");
  const a=acc.draw(skin);
  if(a)gAcc.appendChild(a);
  gHeadAll.appendChild(gAcc);

  svg.appendChild(gHeadAll);
  REFS.head=gHeadAll;

  /* ground shadow */
  svg.appendChild(EL(CX,r.footY+8,72,10,
    {fill:"#000",opacity:.25}));
}

/* ═══════════════════════════════════════════════════════════════════
   24. ANIMATION LOOP
   ═══════════════════════════════════════════════════════════════════ */
let animT0=performance.now();
let blinkNext=1.5;
let blinkState={active:false,start:0};
let smileNext=2;
let smileState={active:false,start:0};

function tick(now){
  const t=(now-animT0)/1000;

  /* idle: head bob & arm sway */
  const headBob=Math.sin(t*Math.PI/2)*1.5;
  const armSway=Math.sin(t*Math.PI/2+0.5)*2;
  const breathe=1+Math.sin(t*Math.PI/2)*0.006;

  if(REFS.head){
    REFS.head.setAttribute("transform",
      `translate(0 ${S(headBob)})`);
  }
  if(REFS.armL&&REFS.armR){
    REFS.armL.setAttribute("transform",
      `rotate(${S(-armSway)} 110 330)`);
    REFS.armR.setAttribute("transform",
      `rotate(${S(armSway)} 290 330)`);
  }
  if(REFS.torso){
    REFS.torso.setAttribute("transform",
      `translate(0 ${S(-headBob*0.4)})`);
  }

  /* blink scheduling */
  if(!blinkState.active&&t>blinkNext){
    blinkState.active=true;blinkState.start=t;
  }
  let blink=0;
  if(blinkState.active){
    const k=t-blinkState.start;
    if(k<0.06)blink=k/0.06;
    else if(k<0.12)blink=1-(k-0.06)/0.06;
    else{blinkState.active=false;blinkNext=t+2+Math.random()*2;blink=0;}
  }
  updateEyelids(blink);

  /* smile scheduling */
  if(!smileState.active&&t>smileNext){
    smileState.active=true;smileState.start=t;
  }
  let smileAmt=0,openAmt=0;
  if(smileState.active){
    const k=t-smileState.start;
    const DUR=2.2;
    if(k<DUR){
      const p=k/DUR;
      /* gentle bell curve for the smile itself */
      const bell=Math.sin(p*Math.PI);
      smileAmt=bell*0.7;
      /* a bare hint of parting the lips mid-smile — never a full
         open-mouth gape, so no sudden teeth/tongue flash */
      openAmt=Math.max(0,Math.sin((p-0.3)*Math.PI/0.4))*0.16;
    }else{
      smileState.active=false;
      smileNext=t+4+Math.random()*3;
      smileAmt=0;openAmt=0;
    }
  }else{
    /* subtle idle smile always present — closed, friendly, no teeth */
    smileAmt=0.10+Math.sin(t*Math.PI/4)*0.03;
  }
  updateMouth(openAmt,smileAmt);

  requestAnimationFrame(tick);
}

function updateEyelids(blink){
  if(!REFS.lids)return;
  REFS.lids.forEach(({lid,eye,h})=>{
    const topY=-h*1.4;
    const botY=-h*1.4+blink*(h*2.7);
    const d=`M ${S(-eye.w)} ${S(topY)} L ${S(eye.w)} ${S(topY)} `
      +`L ${S(eye.w)} ${S(botY)} L ${S(-eye.w)} ${S(botY)} Z`;
    lid.setAttribute("d",d);
  });
}

function updateMouth(open,smile){
  if(!REFS.mouth)return;
  const{lipEl,innerEl,teethEl,tongueEl,mouth}=REFS.mouth;
  const md=mouthData(mouth,open,smile);
  lipEl.setAttribute("d",md.lip);
  innerEl.setAttribute("d",md.inner);
  innerEl.setAttribute("opacity",open>0.18?0.9:0);
  teethEl.setAttribute("d",md.teeth);
  teethEl.setAttribute("opacity",open>0.3?0.88:0);
  const w=mouth.w*(1+smile*.10);
  const lo=mouth.lo;
  const botY=lo+open*(14+lo*1.2);
  tongueEl.setAttribute("cx",0);
  tongueEl.setAttribute("cy",botY*0.55);
  tongueEl.setAttribute("rx",w*0.32);
  tongueEl.setAttribute("ry",Math.max(0.5,lo*0.22));
  tongueEl.setAttribute("opacity",open>0.25?0.9:0);
}

/* ═══════════════════════════════════════════════════════════════════
   25. UI  — modal
   ═══════════════════════════════════════════════════════════════════ */
const CATS=[
  {id:"skin",label:"🎨  Skin Tone"},
  {id:"body",label:"🧍  Body"},
  {id:"hair",label:"💇  Hair"},
  {id:"eyes",label:"👁  Eyes"},
  {id:"brows",label:"🖌  Brows"},
  {id:"lashes",label:"✨  Lashes"},
  {id:"nose",label:"👃  Nose"},
  {id:"mouth",label:"👄  Mouth"},
  {id:"ears",label:"👂  Ears"},
  {id:"neck",label:"🦒  Neck"},
  {id:"top",label:"👕  Tops"},
  {id:"trousers",label:"👖  Trousers"},
  {id:"shoes",label:"👟  Shoes"},
  {id:"texture",label:"🧵  Fabric"},
  {id:"accessory",label:"💍  Accessories"}
];
const ARRAYS={skin:SKIN,body:BODIES,hair:HAIR,eyes:EYES,brows:BROWS,
  lashes:LASHES,nose:NOSES,mouth:MOUTHS,ears:EARS,neck:NECKS,top:TOPS,
  trousers:TROUSERS,shoes:SHOES,texture:TEXTURES,accessory:ACCESSORIES};

let activeCat="skin";
const overlay=document.getElementById("overlay");

function visibleIndices(cat){
  const arr=ARRAYS[cat];
  if(cat!=="top"&&cat!=="trousers")
    return arr.map((_,i)=>i);
  const g=state.gender;
  return arr.map((o,i)=>({o,i}))
    .filter(x=>x.o.g===g||x.o.g==="u").map(x=>x.i);
}
function clampSelection(cat){
  const vis=visibleIndices(cat);
  if(!vis.includes(state[cat]))state[cat]=vis[0];
}
function buildSidebar(){
  const sb=document.getElementById("sidebar");
  sb.innerHTML="";
  CATS.forEach(c=>{
    const b=document.createElement("button");
    b.textContent=c.label;
    if(c.id===activeCat)b.classList.add("on");
    b.onclick=()=>{activeCat=c.id;buildSidebar();buildOptions();};
    sb.appendChild(b);
  });
}
function buildOptions(){
  const grid=document.getElementById("options");
  grid.innerHTML="";
  const arr=ARRAYS[activeCat];
  const vis=visibleIndices(activeCat);
  if(activeCat==="skin"){
    vis.forEach(i=>{
      const s=arr[i];
      const d=document.createElement("div");
      d.className="sw2"+(state.skin===i?" on":"");
      d.style.background=s.c;
      d.innerHTML=`<b>${s.n}</b>`;d.title=s.n;
      d.onclick=()=>{state.skin=i;buildOptions();buildCharacter();};
      grid.appendChild(d);
    });
    return;
  }
  vis.forEach(i=>{
    const o=arr[i];
    const d=document.createElement("div");
    d.className="opt"+(state[activeCat]===i?" on":"");
    const dot=document.createElement("div");
    dot.className="dot";
    let col="#555";
    if(o.c)col=o.c;else if(o.col)col=o.col;else if(o.sw)col=o.sw;
    dot.style.background=col;
    d.appendChild(dot);
    const sp=document.createElement("span");
    sp.textContent=o.n;d.appendChild(sp);
    d.onclick=()=>{state[activeCat]=i;buildOptions();buildCharacter();};
    grid.appendChild(d);
  });
}
function openModal(){
  clampSelection("top");clampSelection("trousers");
  document.getElementById("mtitle").textContent=
    (state.gender==="m"?"♂ Male ":"♀ Female ")+"— Customize";
  buildSidebar();buildOptions();
  overlay.classList.add("on");
}
function closeModal(){overlay.classList.remove("on");}

document.getElementById("open").onclick=openModal;
document.getElementById("close").onclick=closeModal;
overlay.addEventListener("click",e=>{if(e.target===overlay)closeModal();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});

document.getElementById("gM").onclick=()=>{
  state.gender="m";
  document.getElementById("gM").classList.add("on");
  document.getElementById("gF").classList.remove("on");
  clampSelection("top");clampSelection("trousers");
  if(overlay.classList.contains("on"))buildOptions();
  buildCharacter();
};
document.getElementById("gF").onclick=()=>{
  state.gender="f";
  document.getElementById("gF").classList.add("on");
  document.getElementById("gM").classList.remove("on");
  clampSelection("top");clampSelection("trousers");
  if(overlay.classList.contains("on"))buildOptions();
  buildCharacter();
};

document.getElementById("rand").onclick=()=>{
  CATS.forEach(c=>{
    const vis=visibleIndices(c.id);
    state[c.id]=vis[Math.floor(Math.random()*vis.length)];
  });
  if(overlay.classList.contains("on"))buildOptions();
  buildCharacter();
};

document.getElementById("dl").onclick=()=>{
  const svg=document.getElementById("avatar");
  const clone=svg.cloneNode(true);
  clone.setAttribute("xmlns",NS);
  clone.setAttribute("width",800);clone.setAttribute("height",1560);
  const data=new XMLSerializer().serializeToString(clone);
  const img=new Image();
  const blob=new Blob([data],
    {type:"image/svg+xml;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  img.onload=()=>{
    const cv=document.createElement("canvas");
    cv.width=800;cv.height=1560;
    const ctx=cv.getContext("2d");
    ctx.fillStyle="#1b2330";ctx.fillRect(0,0,800,1560);
    ctx.drawImage(img,0,0,800,1560);
    URL.revokeObjectURL(url);
    const a=document.createElement("a");
    a.download="clinmoji-character.png";
    a.href=cv.toDataURL("image/png");
    a.click();
  };
  img.src=url;
};

/* ═══════════════════════════════════════════════════════════════════
   26. BOOT
   ═══════════════════════════════════════════════════════════════════ */
document.getElementById("gM").classList.add("on");
buildCharacter();
requestAnimationFrame(tick);
</script>
